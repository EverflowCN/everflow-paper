<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Everflow 资料中心：408、数学二与学习工具">
  <title>资料中心 · Everflow</title>
  <link rel="icon" href="../assets/everflow-icon.svg">
  <link rel="stylesheet" href="../assets/css/site.css?v=20260825-resource2">
  <link rel="stylesheet" href="../assets/css/responsive.css?v=20260825-resource2">
  <link rel="stylesheet" href="../assets/css/resource-hub-v2.css?v=20260825-resource2">
</head>
<body>
  <header class="topbar">
    <div class="wrap nav">
      <a class="brand" href="../">
        <img src="../assets/everflow-icon.svg" alt="Everflow">
        <span>Everflow<small>彼时流年若水</small></span>
      </a>
      <nav class="links"><button class="icon-btn" data-theme aria-label="切换主题">◐</button></nav>
      <button class="icon-btn menu-btn" data-menu aria-label="菜单">☰</button>
    </div>
  </header>
  <div class="mobile-panel"><button class="icon-btn" data-theme aria-label="切换主题">◐</button></div>

  <main class="resource-v2" data-resource-root aria-busy="true">
    <section class="resource-v2-hero">
      <div class="resource-v2-brand">
        <img src="../assets/everflow-icon.svg" alt="">
        <div><span>EVERFLOW LIBRARY</span><strong>彼时流年若水</strong></div>
      </div>
      <div class="resource-v2-hero-grid">
        <div>
          <p class="resource-v2-kicker" data-resource-updated>面向 27 考研持续更新</p>
          <h1 data-resource-title>Everflow 资料中心</h1>
          <p class="resource-v2-lead" data-resource-subtitle>408、数学二与站内学习工具，按届别和科目快速查找。</p>
        </div>
        <a class="resource-v2-errata" data-resource-errata href="/archive/">
          <span>更新与勘误</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
      <div class="resource-v2-announcement" data-resource-announcement>
        <span>NOTICE</span><p>资料与功能持续整理中；失效入口可通过“更新与勘误”反馈。</p>
      </div>
    </section>

    <section class="resource-v2-browser" aria-label="资料筛选">
      <div class="resource-v2-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" data-resource-search placeholder="搜索资料、科目或关键词…" autocomplete="off" aria-label="搜索资料">
        <kbd>/</kbd>
      </div>
      <div class="resource-v2-cohorts" data-resource-cohorts aria-label="届别"></div>
      <div class="resource-v2-categories" data-resource-categories aria-label="分类"></div>
    </section>

    <section class="resource-v2-summary" aria-live="polite">
      <div><strong data-resource-count>0</strong><span>项资料</span></div>
      <p data-resource-state>正在读取本地资料…</p>
    </section>
    <section class="resource-v2-grid" data-resource-list aria-live="polite"></section>
    <div class="resource-v2-empty" data-resource-empty hidden>
      <strong>没有找到匹配的资料</strong>
      <p>换一个关键词，或切换届别与分类再试。</p>
      <button type="button" data-resource-reset>清除筛选</button>
    </div>
    <footer class="resource-v2-footer"><span data-resource-footer>Everflow · 彼时流年若水</span><b>evera.top</b></footer>
  </main>

  <script src="../assets/js/site-runtime-v2.js?v=20260825-perf2"></script>
  <script src="../assets/js/cloud-config.js"></script>
  <script type="module" src="../assets/js/links.js?v=20260825-resource2"></script>
</body>
</html>
