<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>管理后台 · Everflow</title>
  <link rel="icon" href="../assets/everflow-icon.svg">
  <style>
    :root{--red:#f31224;--ink:#111217;--muted:#747780;--paper:#fff;--soft:#f6f6f8;--line:#e5e5ea}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--soft);color:var(--ink)}a{text-decoration:none;color:inherit}
    .bar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:10}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.brand img{width:34px;height:34px}.brand small{display:block;font-size:11px;color:var(--muted)}.right{margin-left:auto;display:flex;gap:8px}
    .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.danger{color:#b00020}.btn:disabled{opacity:.45;cursor:not-allowed}
    .shell{max-width:1180px;margin:28px auto;padding:0 18px}.login{max-width:520px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 60px rgba(0,0,0,.07);text-align:center}.login img{width:64px}.login h1{margin:18px 0 8px}.login p,.status{color:var(--muted)}.status{font-size:13px;margin-top:14px}
    .dashboard{display:none;grid-template-columns:300px minmax(0,1fr);gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.post-list{display:grid;gap:8px;max-height:70vh;overflow:auto}.post-item{padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.post-item:hover{background:var(--soft)}.post-item strong{display:block}.post-item small{color:var(--muted)}
    label{display:block;font-weight:700;font-size:13px;margin:15px 0 6px}input,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;font:inherit;color:var(--ink)}textarea{min-height:360px;resize:vertical;line-height:1.7}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{padding:12px 14px;border-radius:12px;background:#fff5f6;color:#8d0b17;font-size:13px;margin-bottom:14px;display:none}.notice.ok{background:#f1faf4;color:#176c35}.topline{display:flex;align-items:center;gap:10px;margin-bottom:18px}.topline h1,.topline h2{margin:0}.topline span{color:var(--muted);font-size:13px}
    @media(max-width:800px){.dashboard{grid-template-columns:1fr}.shell{margin-top:18px}.row{grid-template-columns:1fr}.login{margin:36px auto}.post-list{max-height:260px}textarea{min-height:300px}.bar{padding:0 12px}.brand small{display:none}}
  </style>
</head>
<body>
<header class="bar"><a class="brand" href="../"><img src="../assets/everflow-icon.svg" alt="Everflow"><span>Everflow<small>博客管理后台</small></span></a><div class="right"><a class="btn" href="../">查看博客</a><button class="btn" id="logout" style="display:none">退出</button></div></header>
<main class="shell">
  <section class="login" id="login"><img src="../assets/everflow-icon.svg" alt=""><h1>博客管理后台</h1><p>仅允许 GitHub 账号 <strong>EverflowCN</strong> 登录。登录后可以发布、修改和删除文章。</p><button class="btn red" id="loginBtn">使用 GitHub 登录</button><div class="status" id="setupStatus">正在检查后台服务…</div></section>
  <section class="dashboard" id="dashboard">
    <aside class="panel"><div class="topline"><h2>文章</h2><span id="count"></span></div><button class="btn red" id="newBtn" style="width:100%;margin-bottom:12px">＋ 新建文章</button><div class="post-list" id="postList"></div></aside>
    <section class="panel"><div class="topline"><h1 id="editorTitle">新建文章</h1><span id="identity"></span></div><div class="notice" id="notice"></div><div class="row"><div><label>标题</label><input id="title" placeholder="文章标题"></div><div><label>Slug</label><input id="slug" placeholder="example-post"></div></div><div class="row"><div><label>日期</label><input id="date" type="date"></div><div><label>标签</label><input id="tags" placeholder="随笔, 技术"></div></div><label>摘要</label><input id="excerpt" placeholder="首页显示的一句话摘要"><label>正文</label><textarea id="content" placeholder="支持简单 Markdown：## 标题、**加粗**、`代码`、> 引用"></textarea><div class="actions"><button class="btn red" id="publishBtn">发布 / 更新</button><button class="btn" id="clearBtn">清空</button><button class="btn danger" id="deleteBtn">删除当前文章</button></div></section>
  </section>
</main>
<script>
const API='https://api.evera.top';
const $=id=>document.getElementById(id);
let posts=[],current=null;
let token=localStorage.getItem('everflow-admin-token')||'';
if(location.hash.startsWith('#token=')){token=decodeURIComponent(location.hash.slice(7));localStorage.setItem('everflow-admin-token',token);history.replaceState(null,'',location.pathname)}
const authHeaders=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});
function note(msg,ok=false){const n=$('notice');n.textContent=msg;n.className='notice'+(ok?' ok':'');n.style.display='block'}
function slugify(s){return String(s).trim().toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function health(){try{const r=await fetch(API+'/api/health',{cache:'no-store'});const d=await r.json();$('setupStatus').textContent=d.oauthConfigured?'后台服务已就绪。':'GitHub OAuth 尚未配置。';$('loginBtn').disabled=!d.oauthConfigured}catch{$('setupStatus').textContent='后台服务连接失败。';$('loginBtn').disabled=true}}
async function me(){if(!token)return false;try{const r=await fetch(API+'/api/me',{headers:authHeaders()});if(!r.ok)throw new Error();const d=await r.json();$('identity').textContent='已登录：'+d.login;$('login').style.display='none';$('dashboard').style.display='grid';$('logout').style.display='inline-block';await loadPosts();return true}catch{localStorage.removeItem('everflow-admin-token');token='';return false}}
async function loadPosts(){try{const r=await fetch('../data/posts.json?t='+Date.now(),{cache:'no-store'});posts=r.ok?await r.json():[];renderList()}catch{posts=[];renderList()}}
function renderList(){$('count').textContent=posts.length+' 篇';$('postList').innerHTML=posts.map((p,i)=>`<div class="post-item" data-i="${i}"><strong>${escapeHtml(p.title)}</strong><small>${p.date||''} · ${p.slug}</small></div>`).join('')||'<div class="status">还没有文章。</div>';document.querySelectorAll('.post-item').forEach(el=>el.onclick=()=>edit(posts[Number(el.dataset.i)]))}
function edit(p){current=p;$('editorTitle').textContent='编辑文章';$('title').value=p.title||'';$('slug').value=p.slug||'';$('date').value=p.date||'';$('tags').value=(p.tags||[]).join(', ');$('excerpt').value=p.excerpt||'';$('content').value=p.content||'';$('notice').style.display='none';scrollTo({top:0,behavior:'smooth'})}
function clearForm(){current=null;$('editorTitle').textContent='新建文章';['title','slug','tags','excerpt','content'].forEach(id=>$(id).value='');$('date').value=new Date().toISOString().slice(0,10);$('notice').style.display='none'}
$('title').addEventListener('input',()=>{if(!current&&!$('slug').value)$('slug').value=slugify($('title').value)});
$('loginBtn').onclick=()=>location.href=API+'/api/auth/login';
$('logout').onclick=()=>{localStorage.removeItem('everflow-admin-token');location.reload()};
$('newBtn').onclick=clearForm;$('clearBtn').onclick=clearForm;
$('publishBtn').onclick=async()=>{const payload={title:$('title').value.trim(),slug:$('slug').value.trim(),date:$('date').value,tags:$('tags').value,excerpt:$('excerpt').value.trim(),content:$('content').value};if(!payload.title||!payload.slug)return note('标题和 Slug 不能为空。');try{$('publishBtn').disabled=true;note('正在提交到 GitHub…');const r=await fetch(API+'/api/publish',{method:'POST',headers:authHeaders(),body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'发布失败');note('发布成功。GitHub Pages 正在自动部署。',true);await loadPosts();if(d.post)edit(d.post)}catch(e){note(e.message)}finally{$('publishBtn').disabled=false}};
$('deleteBtn').onclick=async()=>{const slug=$('slug').value.trim();if(!slug)return note('当前没有可删除的文章。');if(!confirm('确定删除这篇文章吗？'))return;try{const r=await fetch(API+'/api/delete?slug='+encodeURIComponent(slug),{method:'DELETE',headers:authHeaders()});const d=await r.json();if(!r.ok)throw new Error(d.error||'删除失败');note('已删除，GitHub Pages 正在重新部署。',true);await loadPosts();clearForm()}catch(e){note(e.message)}};
clearForm();health().then(()=>me());
</script>
</body>
</html>
