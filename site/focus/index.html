ass="timer-btn" type="button" data-timer-discard>放弃</button></div><p class="muted" data-focus-message></p></div><div class="study-form"><label>科目<select data-focus-subject><option value="ds">数据结构</option><option value="co">计算机组成原理</option><option value="os">操作系统</option><option value="cn">计算机网络</option><option value="general">综合 / 其他</option></select></label><label>计划时长（分钟）<input type="number" min="1" max="720" value="50" data-focus-minutes></label><div class="quick-links"><button class="small-btn" type="button" data-preset="25">25 min</button><button class="small-btn" type="button" data-preset="50">50 min</button><button class="small-btn" type="button" data-preset="90">90 min</button><button class="small-btn" type="button" data-preset="120">120 min</button></div><label>本次备注<textarea data-focus-note placeholder="例如：OS 进程同步 P/V 操作"></textarea></label></div></section><aside class="study-card"><h3>手动补录</h3><p>忘记开计时器时，可以补上当天真实学习时间。</p><div class="study-form"><label>日期<input type="date" data-manual-date></label><label>科目<select data-manual-subject><option value="ds">数据结构</option><option value="co">计算机组成原理</option><option value="os">操作系统</option><option value="cn">计算机网络</option><option value="general">综合 / 其他</option></select></label><label>有效专注（分钟）<input type="number" min="1" max="1440" value="60" data-manual-minutes></label><label>备注<input type="text" data-manual-note placeholder="可选"></label><button class="timer-btn primary" type="button" data-manual-add>保存补录</button><p class="muted" data-manual-message></p></div><h3 style="margin-top:30px">最近记录</h3><div class="history-list" data-focus-history><div class="muted">正在读取…</div></div></aside></div></main><footer class="footer"><div class="wrap footer-inner"><span>本地优先保存 · 登录后可云同步</span><span><a href="../stats/">查看学习统计 →</a></span></div></footer><script src="../assets/js/site.js"></script><script src="../assets/js/study-store.js"></script><script src="../assets/js/focus.js"></script></body></html>
