<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fa">
  <title>整体图谱 · Everflow</title>
  <link rel="icon" href="../assets/everflow-icon.svg">
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <link rel="stylesheet" href="../assets/css/overall-graph.css?v=20260824f">
</head>
<body data-view="graph">
<header class="topbar">
  <div class="wrap nav">
    <a class="brand" href="../"><img src="../assets/everflow-icon.svg" alt="Everflow"><span>Everflow<small>彼时流年若水</small></span></a>
    <nav class="links"><button class="icon-btn" data-theme aria-label="切换主题">◐</button></nav>
    <button class="icon-btn menu-btn" data-menu aria-label="菜单">☰</button>
  </div>
</header>
<div class="mobile-panel"><button class="icon-btn" data-theme>◐</button></div>

<main class="overview-stage" data-graph-shell>
  <section class="overview-frame">
    <div class="overview-legend" aria-label="掌握状态">
      <span><i class="mastered"></i>熟悉</span>
      <span><i class="fuzzy"></i>模糊</span>
      <span><i class="weak"></i>不会</span>
      <span><i class="unmarked"></i>未做</span>
    </div>
    <div class="overview-scroll">
      <div class="overview-matrix" data-overview-matrix role="grid" aria-label="2009年至2026年408真题整体图谱"></div>
    </div>
  </section>

  <aside class="question-drawer" data-question-drawer hidden aria-label="题目预览">
    <header class="drawer-head">
      <div class="drawer-title"><strong data-drawer-title>真题</strong><span data-drawer-meta></span></div>
      <button class="drawer-close" type="button" data-drawer-close aria-label="隐藏题目侧栏">×</button>
    </header>
    <div class="drawer-body" data-drawer-body><div class="drawer-loading">请选择题目</div></div>
    <footer class="drawer-footer">
      <div class="drawer-status" aria-label="掌握状态">
        <button type="button" data-drawer-status="mastered">熟悉</button>
        <button type="button" data-drawer-status="fuzzy">模糊</button>
        <button type="button" data-drawer-status="weak">不会</button>
        <button type="button" data-drawer-status="">清除</button>
      </div>
      <button class="drawer-answer" type="button" data-drawer-answer hidden>查看答案</button>
    </footer>
  </aside>

  <button class="drawer-reopen" type="button" data-drawer-reopen hidden aria-label="展开题目侧栏">题目</button>
</main>

<script src="../assets/js/site-runtime-v2.js?v=20260824f"></script>
<script src="../assets/js/zhenti-data-overlay.js?v=20260824f"></script>
<script src="../assets/js/overall-graph.js?v=20260824f"></script>
</body>
</html>
