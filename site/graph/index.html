<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fa">
  <meta name="everflow-build" content="20260824-graph-r5">
  <title>整体图谱 · Everflow</title>
  <link rel="icon" href="../assets/everflow-icon.svg">
  <link rel="stylesheet" href="../assets/css/site.css?v=20260824-graph-r5">
  <link rel="stylesheet" href="../assets/css/responsive.css?v=20260824-graph-r5">
  <link rel="stylesheet" href="../assets/css/graph.css?v=20260824-graph-r5">
  <link rel="stylesheet" href="../assets/css/zhenti-status.css?v=20260824-graph-r5">
</head>
<body data-view="graph">
<header class="topbar">
  <div class="wrap nav">
    <a class="brand" href="../"><img src="../assets/everflow-icon.svg" alt="Everflow"><span>Everflow<small>彼时流年若水</small></span></a>
    <nav class="links"><button class="icon-btn" data-theme aria-label="切换主题"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8 8 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z"/></svg></button></nav>
    <button class="icon-btn menu-btn" data-menu aria-label="菜单"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>
<div class="mobile-panel"><button class="icon-btn" data-theme aria-label="切换主题"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8 8 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z"/></svg></button></div>

<main class="overview-stage" data-graph-shell>
  <section class="overview-frame">
    <header class="graph-toolbar" aria-label="图谱控制">
      <div class="graph-toolbar-primary">
        <div class="graph-heading">
          <strong>整体图谱</strong>
          <span data-graph-caption>正在载入图谱…</span>
        </div>
        <div class="graph-source-host" data-graph-source-host></div>
        <div class="graph-view-host" data-graph-view-host></div>
      </div>
      <div class="graph-toolbar-secondary">
        <div class="graph-status-legend" aria-label="掌握状态">
          <span><i class="mastered"></i>熟悉</span>
          <span><i class="fuzzy"></i>模糊</span>
          <span><i class="weak"></i>不会</span>
          <span><i class="unmarked"></i>未做</span>
        </div>
        <div class="graph-shortcuts" aria-label="快捷键提示">方向键移动 · Enter 打开题目 · Esc 关闭</div>
      </div>
    </header>
    <div class="overview-scroll">
      <div class="overview-matrix" data-overview-matrix role="grid" aria-label="408 整体图谱"></div>
    </div>
  </section>

  <aside class="question-drawer" data-question-drawer hidden aria-label="题目预览">
    <header class="drawer-head">
      <div class="drawer-title"><strong data-drawer-title>题目</strong><span data-drawer-meta></span></div>
      <button class="drawer-close ui-icon-only" type="button" data-drawer-close aria-label="隐藏题目侧栏"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </header>
    <div class="drawer-body" data-drawer-body><div class="drawer-loading">正在读取题目…</div></div>
    <footer class="drawer-footer">
      <div class="drawer-status" aria-label="掌握状态">
        <button type="button" data-drawer-status="mastered">熟悉</button>
        <button type="button" data-drawer-status="fuzzy">模糊</button>
        <button type="button" data-drawer-status="weak">不会</button>
        <button type="button" data-drawer-status="">清除</button>
      </div>
      <button class="drawer-answer" type="button" data-drawer-answer hidden>查看答案</button>
    </footer>
  </aside>

  <button class="drawer-reopen" type="button" data-drawer-reopen hidden aria-label="展开题目侧栏">题目</button>
</main>

<script src="../assets/js/site-runtime-v2.js?v=20260824-graph-r5"></script>
<script type="module" src="../assets/js/graph-app.js?v=20260824-graph-r5"></script>
</body>
</html>
