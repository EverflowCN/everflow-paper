<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>整体图谱 · 408</title>
  <link rel="icon" href="../assets/everflow-icon.svg">
  <link rel="stylesheet" href="../assets/css/overall-graph.css?v=20260824a">
</head>
<body>
  <main class="graph-viewport" data-graph-viewport>
    <svg class="graph-svg" data-graph-svg viewBox="0 0 1800 1100" role="img" aria-label="408整体知识图谱">
      <defs>
        <filter id="node-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".10"/>
        </filter>
      </defs>
      <g data-graph-world></g>
    </svg>
  </main>
  <div class="graph-controls" aria-label="图谱控制">
    <button type="button" data-graph-back aria-label="返回">←</button>
    <button type="button" data-graph-out aria-label="缩小">−</button>
    <button type="button" data-graph-fit aria-label="适应屏幕">◎</button>
    <button type="button" data-graph-in aria-label="放大">＋</button>
  </div>
  <script src="../assets/js/overall-graph.js?v=20260824a"></script>
</body>
</html>
