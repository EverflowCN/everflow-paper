<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="t d"><title id="t">2025年第46题虚拟地址空间图</title><desc id="d">依据2025原卷公开扫描重绘：自高地址向低地址依次为内核区、未占用区域、用户栈、运行时堆、可读写数据区、只读代码区。</desc><g font-family="Arial,'Noto Sans CJK SC',sans-serif" stroke="#111" stroke-width="2" fill="white"><rect x="145" y="50" width="230" height="360"/><rect x="145" y="50" width="230" height="55"/><text x="260" y="85" text-anchor="middle" stroke="none" fill="#111" font-size="24">内核区</text><rect x="145" y="105" width="230" height="70" fill="#bdbdbd"/><rect x="145" y="175" width="230" height="55"/><text x="260" y="210" text-anchor="middle" stroke="none" fill="#111" font-size="24">用户栈</text><rect x="145" y="230" width="230" height="55"/><text x="260" y="265" text-anchor="middle" stroke="none" fill="#111" font-size="24">运行时堆</text><rect x="145" y="285" width="230" height="60"/><text x="260" y="322" text-anchor="middle" stroke="none" fill="#111" font-size="24">可读写数据区</text><rect x="145" y="345" width="230" height="65"/><text x="260" y="385" text-anchor="middle" stroke="none" fill="#111" font-size="24">只读代码区</text><text x="260" y="455" text-anchor="middle" stroke="none" fill="#111" font-size="22">题46图</text><text x="260" y="488" text-anchor="middle" stroke="none" fill="#555" font-size="16">阴影部分为未占用区域</text></g></svg>