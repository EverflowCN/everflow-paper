<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="t d"><title id="t">2025年第38题TCP交互图</title><desc id="d">依据2025原卷公开扫描重绘：甲在t0后依次发送seq=2001和seq=3001、各1000B的数据段；乙回送seq=4001、ack_seq=3001、rcwnd=4000B的确认段，甲在t1收到。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><g font-family="Arial,'Noto Sans CJK SC',sans-serif" fill="#111" stroke="#111" stroke-width="2"><line x1="210" y1="70" x2="210" y2="365"/><line x1="610" y1="70" x2="610" y2="365"/><text x="210" y="42" text-anchor="middle" stroke="none" font-size="22">甲</text><text x="610" y="42" text-anchor="middle" stroke="none" font-size="22">乙</text><text x="175" y="105" stroke="none" font-size="18">t0</text><text x="175" y="335" stroke="none" font-size="18">t1</text><line x1="220" y1="115" x2="600" y2="180" marker-end="url(#arr)"/><text x="405" y="125" text-anchor="middle" stroke="none" font-size="18">seq=2001，1000B数据</text><line x1="220" y1="185" x2="600" y2="250" marker-end="url(#arr)"/><text x="405" y="195" text-anchor="middle" stroke="none" font-size="18">seq=3001，1000B数据</text><line x1="600" y1="265" x2="220" y2="325" marker-end="url(#arr)"/><text x="405" y="282" text-anchor="middle" stroke="none" font-size="17">seq=4001，ack_seq=3001</text><text x="405" y="306" text-anchor="middle" stroke="none" font-size="17">rcwnd=4000B</text></g></svg>