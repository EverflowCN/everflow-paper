<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">2025年第36题DHCP交互图</title><desc id="d">依据2025原卷公开扫描重绘：主机H与DHCP服务器192.168.5.1之间，服务器向H提供yiaddr 192.168.5.9，随后H发送REQUEST。</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><g font-family="Arial,'Noto Sans CJK SC',sans-serif" fill="#111" stroke="#111" stroke-width="2"><line x1="220" y1="60" x2="220" y2="315"/><line x1="540" y1="60" x2="540" y2="315"/><text x="220" y="38" text-anchor="middle" stroke="none" font-size="20">H</text><text x="540" y="28" text-anchor="middle" stroke="none" font-size="20">DHCP</text><text x="540" y="50" text-anchor="middle" stroke="none" font-size="18">192.168.5.1</text><line x1="530" y1="120" x2="230" y2="165" marker-end="url(#arr)"/><text x="380" y="122" text-anchor="middle" stroke="none" font-size="18">yiaddr: 192.168.5.9</text><line x1="230" y1="220" x2="530" y2="270" marker-end="url(#arr)"/><text x="380" y="220" text-anchor="middle" stroke="none" font-size="18">REQUEST（请求 192.168.5.9）</text></g></svg>