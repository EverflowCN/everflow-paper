<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="t d"><title id="t">2023年第45题swap互斥伪代码</title><desc id="d">依据厦门工学院公开的2023年408原卷扫描重绘两块伪代码面板，保留TRUE/FALSE、if、swap、进入区、临界区和退出区等原始信息。</desc><style>text{font-family:'Courier New',monospace;fill:#111}.h{font-family:Arial,sans-serif;font-weight:700}</style><g fill="#fff" stroke="#111" stroke-width="2"><rect x="20" y="18" width="550" height="365"/><rect x="600" y="18" width="360" height="365"/></g><g font-size="21"><text class="h" x="185" y="48" font-size="22">某同学编写的伪代码</text><text x="48" y="82">bool lock = FALSE;   // 共享变量</text><text x="48" y="110">......</text><rect x="42" y="125" width="445" height="112" fill="none" stroke="#111" stroke-dasharray="8 7"/><text x="58" y="154">bool key = TRUE;</text><text x="58" y="184">if (key == TRUE)</text><text x="84" y="214">swap key, lock; // 交换 key 和 lock 的值</text><text class="h" x="495" y="186" font-size="20">进入区</text><text x="58" y="266">临界区;</text><rect x="42" y="282" width="445" height="50" fill="none" stroke="#111" stroke-dasharray="8 7"/><text x="58" y="315">lock = TRUE;</text><text class="h" x="495" y="314" font-size="20">退出区</text><text x="48" y="360">......</text><text class="h" x="706" y="48" font-size="22">newSwap() 的伪代码</text><text x="625" y="88">void newSwap(bool *a, bool *b) {</text><text x="651" y="120">bool temp = *a;</text><text x="651" y="152">*a = *b;</text><text x="651" y="184">*b = temp;</text><text x="625" y="216">}</text><text class="h" x="286" y="408" font-size="18">(a)</text><text class="h" x="770" y="408" font-size="18">(b)</text></g></svg>