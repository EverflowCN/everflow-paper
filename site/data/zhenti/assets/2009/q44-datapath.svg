<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">2009 年 408 第 44 题数据通路</title><desc id="desc">16位计算机部分数据通路，含存储器、CB/DB/AB、MAR、MDR、R0、R1、A、ALU、AC、PC、IR及原题控制信号。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111;font-size:18px}.small{font-size:15px}.box{fill:#fff;stroke:#111;stroke-width:2}.bus{stroke:#111;stroke-width:3;fill:none}.wire{stroke:#111;stroke-width:2;fill:none}.ctrl{font-size:15px}.bold{font-weight:700}</style>
<!-- memory -->
<rect x="360" y="35" width="380" height="78" class="box"/><text x="550" y="62" text-anchor="middle" class="bold">存储器 (M)</text><text x="435" y="92" text-anchor="middle">MemR</text><text x="520" y="92" text-anchor="middle">MemW</text><text x="620" y="92" text-anchor="middle">Data</text><text x="705" y="92" text-anchor="middle">Addr</text>
<!-- upper buses -->
<line x1="150" y1="145" x2="930" y2="145" class="bus"/><text x="945" y="151" class="bold">CB</text>
<line x1="150" y1="180" x2="930" y2="180" class="bus"/><text x="945" y="186" class="bold">DB</text>
<line x1="150" y1="215" x2="930" y2="215" class="bus"/><text x="945" y="221" class="bold">AB</text>
<path d="M435 113 V145 M520 113 V145 M620 113 V180 M705 113 V215" class="wire"/>
<!-- MAR/MDR -->
<rect x="245" y="270" width="70" height="42" class="box"/><text x="280" y="297" text-anchor="middle" class="bold">MAR</text>
<rect x="500" y="270" width="76" height="42" class="box"/><text x="538" y="297" text-anchor="middle" class="bold">MDR</text>
<path d="M280 270 V215" class="wire"/><text x="305" y="250" class="ctrl">MARin</text>
<path d="M538 270 V180" class="wire"/><text x="548" y="238" class="ctrl">MDRinE</text>
<path d="M500 291 H430" class="wire"/><text x="430" y="280" class="ctrl">MDRin</text>
<path d="M538 270 V145" class="wire"/><text x="455" y="167" class="ctrl">MDRoutE</text>
<!-- internal bus -->
<line x1="150" y1="365" x2="930" y2="365" class="bus"/>
<path d="M280 312 V365 M538 312 V365" class="wire"/><text x="548" y="343" class="ctrl">MDRout</text>
<!-- registers R0/R1 -->
<rect x="250" y="420" width="64" height="40" class="box"/><text x="282" y="446" text-anchor="middle" class="bold">R0</text>
<rect x="250" y="505" width="64" height="40" class="box"/><text x="282" y="531" text-anchor="middle" class="bold">R1</text>
<path d="M282 420 V365 M282 460 V505 M250 440 H195 V365 M250 525 H195 V365" class="wire"/>
<text x="205" y="408" class="ctrl">R0in</text><text x="294" y="398" class="ctrl">R0out</text><text x="205" y="493" class="ctrl">R1in</text><text x="294" y="486" class="ctrl">R1out</text>
<!-- A ALU AC -->
<rect x="500" y="410" width="68" height="40" class="box"/><text x="534" y="436" text-anchor="middle" class="bold">A</text><path d="M534 410 V365" class="wire"/><text x="476" y="400" class="ctrl">Ain</text>
<polygon points="492,500 576,500 560,555 508,555" class="box"/><text x="534" y="535" text-anchor="middle" class="bold">ALU</text><text x="455" y="528" class="ctrl">ADD</text>
<rect x="500" y="590" width="68" height="40" class="box"/><text x="534" y="616" text-anchor="middle" class="bold">AC</text><path d="M534 450 V500 M534 555 V590 M500 610 H430 V365" class="wire"/><text x="463" y="582" class="ctrl">ACin</text><text x="435" y="598" class="ctrl">ACout</text>
<!-- PC/IR -->
<rect x="765" y="420" width="70" height="40" class="box"/><text x="800" y="446" text-anchor="middle" class="bold">PC</text>
<rect x="765" y="535" width="70" height="40" class="box"/><text x="800" y="561" text-anchor="middle" class="bold">IR</text>
<path d="M800 420 V365 M765 440 H720 V365 M800 460 V535 M835 440 H880 V365 M800 575 V650" class="wire"/>
<text x="710" y="408" class="ctrl">PCout</text><text x="842" y="408" class="ctrl">PCin</text><text x="812" y="493" class="ctrl">PC+1</text><text x="840" y="557" class="ctrl">IRin</text><text x="800" y="680" text-anchor="middle" class="small">至指令译码部件</text>
<!-- legend -->
<rect x="120" y="610" width="250" height="100" class="box"/><text x="140" y="640" class="bold">控制信号图例</text><text x="140" y="670" class="small">Xout：三态门及其控制信号</text><text x="140" y="696" class="small">Xin：寄存器输入控制信号</text>
</svg>