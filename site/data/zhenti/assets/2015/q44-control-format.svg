<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="t d"><title id="t">2015年第44题控制信号与指令格式</title><desc id="d">题44图a控制信号流程和图b 16位指令格式，含编号①至⑧。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111;font-size:17px}.b{fill:#fff;stroke:#111;stroke-width:2}.line{stroke:#111;stroke-width:2;fill:none}.dash{stroke:#111;stroke-width:2;stroke-dasharray:7 5;fill:none}.bold{font-weight:700}.small{font-size:14px}</style><text x="70" y="42" class="bold">图 a　部分指令执行过程的控制信号</text><rect x="60" y="65" width="1060" height="430" class="b"/><text x="90" y="100" class="bold">取指阶段</text><rect x="105" y="125" width="245" height="70" class="b"/><text x="225" y="153" text-anchor="middle">PCout=1，MARin=1，Tin=1</text><text x="225" y="178" text-anchor="middle">MEMop=read</text><path class="line" d="M350 160H425"/><rect x="425" y="125" width="280" height="70" class="b"/><text x="565" y="151" text-anchor="middle">MUXop=①，ALUop=add</text><text x="565" y="177" text-anchor="middle">SRop=②</text><path class="line" d="M705 160H780"/><rect x="780" y="125" width="245" height="70" class="b"/><text x="902" y="153" text-anchor="middle">SRout=1，PCin=1</text><text x="902" y="178" text-anchor="middle">随后 MDRout=1，IRin=1</text><text x="90" y="235" class="bold">shl R2,R1 执行阶段</text><rect x="105" y="255" width="310" height="62" class="b"/><text x="260" y="282" text-anchor="middle">R1out=1，Tin=1，ALUop=③</text><text x="260" y="306" text-anchor="middle">SRop=④</text><path class="line" d="M415 286H505"/><rect x="505" y="255" width="250" height="62" class="b"/><text x="630" y="293" text-anchor="middle">SRout=1，R2in=1</text><text x="90" y="360" class="bold">sub R0,R2,(R1) 执行阶段</text><rect x="105" y="380" width="285" height="78" class="b"/><text x="247" y="407" text-anchor="middle">R1out=1，MARin=1</text><text x="247" y="433" text-anchor="middle">MEMop=⑤</text><rect x="430" y="380" width="245" height="78" class="b"/><text x="552" y="407" text-anchor="middle">R2out=1，Tin=1</text><text x="552" y="433" text-anchor="middle">MDRout=1，MUXop=1</text><rect x="715" y="380" width="300" height="78" class="b"/><text x="865" y="405" text-anchor="middle">ALUop=⑥，SRop=⑦</text><text x="865" y="432" text-anchor="middle">⑧=1，R0in=1</text><path class="line" d="M390 419H430 M675 419H715"/><text x="70" y="540" class="bold">图 b　16 位指令格式</text><g><rect x="70" y="570" width="420" height="72" class="b"/><line x1="280" y1="570" x2="280" y2="642" class="line"/><line x1="320" y1="570" x2="320" y2="642" class="line"/><line x1="370" y1="570" x2="370" y2="642" class="line"/><line x1="410" y1="570" x2="410" y2="642" class="line"/><line x1="455" y1="570" x2="455" y2="642" class="line"/><text x="175" y="611" text-anchor="middle" class="bold">OP（7位）</text><text x="300" y="611" text-anchor="middle">Md</text><text x="345" y="611" text-anchor="middle">Rd</text><text x="390" y="611" text-anchor="middle">Ms1</text><text x="432" y="611" text-anchor="middle">Rs1</text><text x="472" y="611" text-anchor="middle">Ms2/Rs2</text></g><text x="535" y="585">Md、Ms1、Ms2：寻址方式位（0=寄存器直接，1=寄存器间接）</text><text x="535" y="616">Rd、Rs1、Rs2：R0～R3 编号字段（00～11）</text><text x="535" y="647">三地址：OP 源1 源2 → 目的；二地址末3位为0；单地址末6位为0。</text><text x="70" y="700" class="small">编号标准答案：①0，②mov，③mova，④left，⑤read，⑥sub，⑦mov，⑧SRout。</text></svg>