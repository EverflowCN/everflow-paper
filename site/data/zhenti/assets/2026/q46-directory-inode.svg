<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">2026年第46题目录结构与索引节点表</title>
<desc id="desc">目录dir包含dir1，dir1包含file；索引节点号分别为100、201、1000。</desc>
<rect width="1000" height="620" fill="#fff"/>
<g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" fill="#111">
  <text x="50" y="48" font-size="27" font-weight="700">题 46 · 目录结构与索引节点表</text>
  <g stroke="#252a31" stroke-width="3" fill="none">
    <path d="M205 145V235H305V325H405"/>
  </g>
  <g>
    <rect x="125" y="105" width="160" height="70" rx="12" fill="#fff4ce" stroke="#d3a62d" stroke-width="2.5"/>
    <text x="205" y="150" text-anchor="middle" font-size="26" font-weight="700">dir</text>
    <rect x="305" y="195" width="170" height="70" rx="12" fill="#fff4ce" stroke="#d3a62d" stroke-width="2.5"/>
    <text x="390" y="240" text-anchor="middle" font-size="26" font-weight="700">dir1</text>
    <rect x="405" y="285" width="170" height="70" rx="12" fill="#edf3fa" stroke="#8ba2bc" stroke-width="2.5"/>
    <text x="490" y="330" text-anchor="middle" font-size="26" font-weight="700">file</text>
  </g>
  <text x="205" y="195" text-anchor="middle" font-size="17" fill="#676d76">包含</text>
  <text x="390" y="285" text-anchor="middle" font-size="17" fill="#676d76">包含</text>

  <g transform="translate(170,400)">
    <rect x="0" y="0" width="660" height="160" fill="#fff" stroke="#20242a" stroke-width="2.5"/>
    <line x1="330" y1="0" x2="330" y2="160" stroke="#20242a" stroke-width="2"/>
    <line x1="0" y1="40" x2="660" y2="40" stroke="#20242a" stroke-width="2"/>
    <line x1="0" y1="80" x2="660" y2="80" stroke="#20242a" stroke-width="1.7"/>
    <line x1="0" y1="120" x2="660" y2="120" stroke="#20242a" stroke-width="1.7"/>
    <text x="165" y="28" text-anchor="middle" font-size="22" font-weight="700">文件名</text>
    <text x="495" y="28" text-anchor="middle" font-size="22" font-weight="700">索引节点号</text>
    <text x="30" y="68" font-size="21">dir</text><text x="360" y="68" font-size="21">100</text>
    <text x="30" y="108" font-size="21">dir1</text><text x="360" y="108" font-size="21">201</text>
    <text x="30" y="148" font-size="21">file</text><text x="360" y="148" font-size="21">1000</text>
  </g>
</g>
</svg>