<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="title desc">
  <title id="title">2026年第37题 链路状态路由与聚合拓扑</title>
  <desc id="desc">R1与R2链路在t1断开，R1经R3和R4重新计算到四个199.10.20.0网段的最短路径，并保留默认与直连路由。</desc>
  <rect width="980" height="600" fill="#fff"/>
  <text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" fill="#111827">链路状态路由重算（t1）</text>
  <g font-family="Arial,'PingFang SC',sans-serif" font-size="15" fill="#0f172a" stroke="#475569" stroke-width="2">
    <line x1="250" y1="285" x2="570" y2="170"/><text x="400" y="205" stroke="none" fill="#334155">cost 6</text>
    <line x1="250" y1="285" x2="570" y2="405"/><text x="400" y="365" stroke="none" fill="#334155">cost 3</text>
    <line x1="570" y1="170" x2="790" y2="115"/><text x="675" y="124" stroke="none" fill="#334155">cost 5</text>
    <line x1="570" y1="405" x2="570" y2="170"/><text x="585" y="292" stroke="none" fill="#334155">cost 4</text>
    <line x1="250" y1="285" x2="790" y2="115" stroke="#ef4444" stroke-dasharray="10 8"/><text x="505" y="150" stroke="none" fill="#b91c1c">R1–R2：t1 断开</text>
  </g>
  <g font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">
    <rect x="185" y="245" width="130" height="80" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250" y="292" text-anchor="middle" fill="#1e3a8a">R1</text>
    <rect x="515" y="130" width="110" height="80" rx="18" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="570" y="177" text-anchor="middle" fill="#134e4a">R3</text>
    <rect x="515" y="365" width="110" height="80" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="570" y="412" text-anchor="middle" fill="#92400e">R4</text>
    <rect x="735" y="75" width="110" height="80" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="790" y="122" text-anchor="middle" fill="#5b21b6">R2</text>
  </g>
  <g font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#111827">
    <rect x="735" y="185" width="190" height="42" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="830" y="211" text-anchor="middle">199.10.20.0/27</text>
    <rect x="625" y="255" width="190" height="42" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="720" y="281" text-anchor="middle">199.10.20.32/27</text>
    <rect x="690" y="385" width="190" height="42" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="785" y="411" text-anchor="middle">199.10.20.64/27</text>
    <rect x="690" y="445" width="190" height="42" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="785" y="471" text-anchor="middle">199.10.20.128/25</text>
    <line x1="790" y1="155" x2="790" y2="185" stroke="#64748b" stroke-width="2"/>
    <line x1="625" y1="190" x2="675" y2="255" stroke="#64748b" stroke-width="2"/>
    <line x1="625" y1="405" x2="690" y2="405" stroke="#64748b" stroke-width="2"/>
    <line x1="625" y1="425" x2="690" y2="466" stroke="#64748b" stroke-width="2"/>
  </g>
  <g font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#334155">
    <rect x="70" y="130" width="160" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="150" y="158" text-anchor="middle">Internet · 默认路由</text>
    <rect x="70" y="395" width="160" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="150" y="423" text-anchor="middle">Host / 直连网段</text>
    <line x1="205" y1="174" x2="235" y2="245" stroke="#64748b" stroke-width="2"/>
    <line x1="205" y1="395" x2="235" y2="325" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="490" y="548" text-anchor="middle" font-size="14" font-family="Arial,'PingFang SC',sans-serif" fill="#475569">断链后：.0/27 与 .32/27 同走 R3，可聚合为 199.10.20.0/26；其余前缀不能继续合并。</text>
  <text x="490" y="574" text-anchor="middle" font-size="12" font-family="Arial,'PingFang SC',sans-serif" fill="#64748b">依据公开题面和路由重算结果重绘，保留解题所需链路费用、前缀、默认与直连条目。</text>
</svg>