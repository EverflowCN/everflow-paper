<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="title desc">
<title id="title">2026年第28题三级页表虚拟地址结构</title>
<desc id="desc">64位虚拟地址由25位补充位、三级各9位页表索引和12位页内偏移组成。</desc>
<rect width="1100" height="220" fill="#fff"/>
<g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" fill="#111" stroke="#222" stroke-width="2">
  <rect x="50" y="55" width="300" height="100" fill="#f5f6f8"/>
  <rect x="350" y="55" width="170" height="100" fill="#eaf3ff"/>
  <rect x="520" y="55" width="170" height="100" fill="#eaf3ff"/>
  <rect x="690" y="55" width="170" height="100" fill="#eaf3ff"/>
  <rect x="860" y="55" width="190" height="100" fill="#fff3df"/>
</g>
<g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" fill="#111" text-anchor="middle">
  <text x="200" y="96" font-size="25" font-weight="700">补充位</text><text x="200" y="130" font-size="22">25 bit</text>
  <text x="435" y="96" font-size="23" font-weight="700">一级页表</text><text x="435" y="130" font-size="22">9 bit</text>
  <text x="605" y="96" font-size="23" font-weight="700">二级页表</text><text x="605" y="130" font-size="22">9 bit</text>
  <text x="775" y="96" font-size="23" font-weight="700">三级页表</text><text x="775" y="130" font-size="22">9 bit</text>
  <text x="955" y="96" font-size="23" font-weight="700">页内偏移</text><text x="955" y="130" font-size="22">12 bit</text>
  <text x="550" y="195" font-size="20" fill="#666">64 位虚拟地址</text>
</g>
</svg>