<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 348" role="img" aria-labelledby="title desc">
<title id="title">2024年408第43题图(a)：add、slli、lw指令格式、编码与功能</title>
<desc id="desc">add指令0000000 rs2 rs1 000 rd 0110011；slli指令0000000 shamt rs1 010 rd 0010011；lw指令的31到20位为12位imm，后接rs1 010 rd 0000011。</desc>
