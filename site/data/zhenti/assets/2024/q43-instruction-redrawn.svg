<g font-weight="750"><text x="78" y="108">add</text><text x="78" y="175">slli</text><text x="78" y="242">lw</text></g>
<text x="199" y="108">0000000</text><text x="312" y="108">rs2</text><text x="430" y="108">rs1</text><text x="527" y="108">000</text><text x="620" y="108">rd</text><text x="717" y="108">0110011</text>
<text x="199" y="175">0000000</text><text x="312" y="175">shamt</text><text x="430" y="175">rs1</text><text x="527" y="175">010</text><text x="620" y="175">rd</text><text x="717" y="175">0010011</text>
<text x="256" y="242">imm</text><text x="430" y="242">rs1</text><text x="527" y="242">010</text><text x="620" y="242">rd</text><text x="717" y="242">0000011</text>
