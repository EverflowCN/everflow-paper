<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" role="img" aria-labelledby="title desc">
<title id="title">2024年408第43题图(b)：ALU部分数据通路及控制信号</title>
<desc id="desc">A作为32位数据输入ALU；B与IR[31:20]经过扩展器形成的32位数据通过MUX选择后作为ALU的第二输入。Ext控制零扩展或符号扩展，ALUBsrc控制MUX，ALUctr为3位控制信号，ALU输出32位F及OF、SF、ZF、CF。</desc>
