<g font-family="Inter,Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#0f172a" font-size="26" text-anchor="start">
<text x="55" y="130">A</text><text x="55" y="269">B</text><text x="36" y="445">IR[31:20]</text>
</g>
