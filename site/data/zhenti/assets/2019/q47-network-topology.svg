<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">2019 年 408 第 47 题网络拓扑</title><desc id="desc">Internet连接路由器R，R经192.168.1.253/30连接设备1的IF1。设备1的IF2、IF3分别连接设备2、设备3；设备2连接H1/H2，设备3连接H3/H4。各主机IP与默认网关按原题标注。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111;font-size:18px}.small{font-size:16px}.box{fill:#f7f7f7;stroke:#111;stroke-width:2}.line{stroke:#111;stroke-width:2;fill:none}.bold{font-weight:700}</style>
<!-- Internet and R -->
<ellipse cx="160" cy="70" rx="85" ry="38" class="box"/><text x="160" y="77" text-anchor="middle" class="bold">Internet</text>
<rect x="430" y="34" width="80" height="68" rx="10" class="box"/><text x="470" y="64" text-anchor="middle" class="bold">R</text><text x="470" y="87" text-anchor="middle" class="small">路由器</text>
<line x1="245" y1="70" x2="430" y2="70" class="line"/><text x="350" y="55" text-anchor="middle">101.1.2.10</text>
<line x1="470" y1="102" x2="470" y2="165" class="line"/><text x="487" y="132" class="small">192.168.1.253/30</text>
<!-- device1 -->
<rect x="430" y="165" width="80" height="70" class="box"/><text x="470" y="207" text-anchor="middle" class="bold">设备1</text><text x="470" y="158" text-anchor="middle" class="small">IF1</text><text x="418" y="202" text-anchor="end" class="small">IF2</text><text x="522" y="202" class="small">IF3</text>
<path d="M430 200 H275 V285" class="line"/><path d="M510 200 H725 V285" class="line"/>
<!-- device2 -->
<rect x="235" y="285" width="80" height="70" class="box"/><text x="275" y="327" text-anchor="middle" class="bold">设备2</text><text x="275" y="278" text-anchor="middle" class="small">IF1</text><text x="223" y="322" text-anchor="end" class="small">IF2</text><text x="327" y="322" class="small">IF3</text>
<!-- device3 -->
<rect x="685" y="285" width="80" height="70" class="box"/><text x="725" y="327" text-anchor="middle" class="bold">设备3</text><text x="725" y="278" text-anchor="middle" class="small">IF1</text><text x="673" y="322" text-anchor="end" class="small">IF2</text><text x="777" y="322" class="small">IF3</text>
<!-- hosts -->
<path d="M235 320 L150 405" class="line"/><path d="M315 320 L365 405" class="line"/><path d="M685 320 L640 405" class="line"/><path d="M765 320 L855 405" class="line"/>
<g>
<rect x="105" y="405" width="90" height="52" class="box"/><text x="150" y="437" text-anchor="middle" class="bold">H1</text>
<rect x="320" y="405" width="90" height="52" class="box"/><text x="365" y="437" text-anchor="middle" class="bold">H2</text>
<rect x="595" y="405" width="90" height="52" class="box"/><text x="640" y="437" text-anchor="middle" class="bold">H3</text>
<rect x="810" y="405" width="90" height="52" class="box"/><text x="855" y="437" text-anchor="middle" class="bold">H4</text>
</g>
<g text-anchor="middle" class="small">
<text x="150" y="485">IP：192.168.1.2/26</text><text x="150" y="510">默认网关：192.168.1.1</text>
<text x="365" y="485">IP：192.168.1.3/26</text><text x="365" y="510">默认网关：192.168.1.1</text>
<text x="640" y="485">IP：192.168.1.66/26</text><text x="640" y="510">默认网关：192.168.1.65</text>
