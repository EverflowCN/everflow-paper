name: Finalize account fix log once

on:
  push:
    paths:
      - '.github/workflows/finalize-account-fix-log-once.yml'

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Record final Pages result
        run: python .github/scripts/finalize_account_fix_log.py
      - name: Commit log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Everflow Maintenance'
          git config user.email '54564601+EverflowCN@users.noreply.github.com'
          git add docs/FIX_LOG.md
          git commit -m 'docs: record account auth Pages 217 result'
          git push origin HEAD:main
