name: Build private FocusPomo bundle

on:
  push:
    branches: [main]
    paths:
      - 'backend/focuspomo/**'
      - '.github/workflows/build-focus-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focus-bundle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate FocusPomo source
        run: |
          set -euo pipefail
          node --test \
            backend/focuspomo/engine.test.mjs \
            backend/focuspomo/fruit.test.mjs \
            backend/focuspomo/handler.test.mjs
          node --check backend/focuspomo/app.js
          node --check backend/focuspomo/fruit-addon.js
          node --check backend/focuspomo/fruit-fixes.js
          node --check backend/focuspomo/failed-fruit-addon.js
          node --check backend/focuspomo/original-ui-addon.js
          node --check backend/focuspomo/original-assets-base.js
          for f in backend/focuspomo/original-asset-*.js; do node --check "$f"; done
          node --check site/me/focus/gate.js

      - name: Build private bundle
        run: |
          set -euo pipefail
          node backend/focuspomo/build-bundle.mjs
          git diff --check
          grep -q 'defaultFruit' supabase/functions/owner-focus/bundle.ts
          grep -q 'fruitSide' supabase/functions/owner-focus/engine.mjs
          grep -q 'FP_ORIGINAL_ASSET_DATA.fail1' supabase/functions/owner-focus/bundle.ts
          grep -q 'FP_ORIGINAL_ASSET_DATA.failedData' supabase/functions/owner-focus/bundle.ts
          grep -q 'FP_ORIGINAL_ASSET_DATA.pause' supabase/functions/owner-focus/bundle.ts
          grep -q 'fp-original-background' supabase/functions/owner-focus/bundle.ts
          grep -q 'original-picker-marker' supabase/functions/owner-focus/bundle.ts

      - name: Deploy owner-focus when token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN is not configured; skip automatic Edge Function deployment.'
            exit 0
          fi
          npx --yes supabase@latest functions deploy owner-focus --project-ref xzodetdohinktagxuwhs

      - name: Commit generated owner-focus bundle
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/owner-focus/bundle.ts supabase/functions/owner-focus/engine.mjs; then
            echo 'Generated bundle already up to date.'
            exit 0
          fi
          git config user.name 'Everflow Focus Builder'
          git config user.email '54564601+EverflowCN@users.noreply.github.com'
          git add supabase/functions/owner-focus/bundle.ts supabase/functions/owner-focus/engine.mjs
          git commit -m 'build(focus): refresh private bundle [skip ci]'
          git push origin HEAD:main
