name: Build PDF worker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/pdf/Dockerfile.worker'
      - 'tools/pdf/worker_daemon.py'
      - 'tools/pdf/worker.py'
      - 'tools/pdf/render.py'
      - 'tools/pdf/template/**'
      - 'tools/pdf/test_render.py'
      - 'tools/pdf/test_worker.py'
      - '.github/workflows/pdf-worker-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: pdf-worker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/pdf/Dockerfile.worker
          push: true
          tags: ghcr.io/everflowcn/everflow-pdf-worker:sha-${{ github.sha }}
          build-args: |
            EVERFLOW_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Test immutable worker image
        run: |
          IMAGE="ghcr.io/everflowcn/everflow-pdf-worker:sha-${GITHUB_SHA}"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" bash -lc 'PYTHONPATH=tools/pdf python3 -m unittest test_render.Safety.test_svg_css_allows_local_fragments_only test_render.Safety.test_imported_soft_linebreaks_do_not_split_tokens test_render.Safety.test_imported_lists_keep_line_structure test_render.Safety.test_imported_duplicate_table_is_removed_when_figure_exists test_render.Safety.test_imported_pipe_table_renders_as_latex_table test_render.Safety.test_real_zhenti_override_cleanup test_render.Safety.test_canonical_figures test_render.Safety.test_failed_zhenti_export_regression test_render.Safety.test_reported_76397_export_regression test_render.Safety.test_compile && PYTHONPATH=tools/pdf python3 tools/pdf/test_worker.py'
      - name: Promote tested image to latest
        run: |
          IMAGE="ghcr.io/everflowcn/everflow-pdf-worker:sha-${GITHUB_SHA}"
          docker tag "$IMAGE" ghcr.io/everflowcn/everflow-pdf-worker:latest
          docker push ghcr.io/everflowcn/everflow-pdf-worker:latest
