name: Batch question cloud sync once

on:
  push:
    paths:
      - '.github/workflows/batch-question-cloud-sync-once.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply batched question sync patch
        run: python .github/scripts/batch_question_cloud_sync.py
      - name: Validate sync policy
        shell: bash
        run: |
          set -euo pipefail
          node --check site/assets/js/question-cloud-sync-v2.js
          node site/tools/audit-bank-features.mjs
          grep -q 'CHANGE_DEBOUNCE_MS=15000' site/assets/js/question-cloud-sync-v2.js
          ! grep -q 'location.reload' site/assets/js/question-cloud-sync-v2.js
          grep -q '20260902-qsync3' site/assets/js/zhenti-entry.js
          grep -q '20260902-qsync3' site/assets/js/question-choice-qwer.js
          grep -q '20260902-qsync3' site/assets/js/account-auth-sync-v2.js
          grep -q 'course13-qsync-batched' site/sw.js
          git diff --check
      - name: Commit corrected site files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Everflow Maintenance'
          git config user.email '54564601+EverflowCN@users.noreply.github.com'
          git add site
          git commit -m 'fix(sync): batch question cloud writes and remove reloads'
          git push origin HEAD:main
