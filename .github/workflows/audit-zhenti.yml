name: Audit 408 verified corpus

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose every JSON file
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='site/data/zhenti';
          function walk(dir){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,ent.name);
              if(ent.isDirectory())walk(p);
              else if(ent.name.endsWith('.json')){
                const text=fs.readFileSync(p,'utf8');
                try{JSON.parse(text);}
                catch(e){
                  console.log('JSONFAIL',p,e.message);
                  const m=String(e.message).match(/position (\d+)/);
                  if(m){const pos=Number(m[1]);console.log('CONTEXT',JSON.stringify(text.slice(Math.max(0,pos-250),pos+250)));}
                }
              }
            }
          }
          walk(root);
          NODE

      - name: Run exhaustive 846-question audit
        id: audit
        continue-on-error: true
        run: node site/tools/audit-zhenti.mjs

      - name: Print full audit report
        if: always()
        run: |
          if [ ! -f site/data/zhenti/audit-report.json ]; then
            echo 'audit-report.json was not generated'
            exit 0
          fi
          python - <<'PY'
          import json
          p='site/data/zhenti/audit-report.json'
          with open(p,'r',encoding='utf-8') as f:
              d=json.load(f)
          print('SUMMARY', json.dumps(d['summary'], ensure_ascii=False))
          for year, info in d['years'].items():
              print('YEAR', year, json.dumps(info, ensure_ascii=False))
          for row in d['failures']:
              print('FAIL', json.dumps(row, ensure_ascii=False))
          for row in d.get('figureFailures', []):
              print('FIGFAIL', json.dumps(row, ensure_ascii=False))
          for row in d.get('manifestFailures', []):
              print('MANIFESTFAIL', json.dumps(row, ensure_ascii=False))
          PY

      - name: Require healthy corpus
        if: steps.audit.outcome == 'failure'
        run: exit 1
