name: Finalize auth and question cloud rollout once

on:
  push:
    paths:
      - '.github/workflows/auth-question-cloud-rollout-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Repair one-time locator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/finalize_auth_cloud.py')
          t=p.read_text(encoding='utf-8')
          old="target = '          test -s site/assets/js/graph-app.js'\nassert lines.count(target) == 1\ni = lines.index(target)"
          new="target = '          test -s site/assets/js/graph-app.js'\nassert lines.count(target) >= 1\ni = lines.index(target)"
          assert t.count(old)==1
          p.write_text(t.replace(old,new),encoding='utf-8')
          PY
      - name: Apply guarded rollout patches
        run: python .github/scripts/finalize_auth_cloud.py
      - name: Validate auth and question cloud modules
        shell: bash
        run: |
          set -euo pipefail
          node --check site/assets/js/cloud.js
          node --check site/assets/js/account-auth-sync-v2.js
          node --check site/assets/js/question-cloud-sync-v2.js
          node --check site/assets/js/question-choice-qwer.js
          node --check site/assets/js/zhenti-entry.js
          node --check site/sw.js
          node site/tools/audit-bank-features.mjs
          git diff --check
      - name: Commit finalized rollout
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/auth-question-cloud-rollout-once.yml
          rm -f .github/scripts/finalize_auth_cloud.py
          git config user.name 'Everflow Maintenance'
          git config user.email '54564601+EverflowCN@users.noreply.github.com'
          git add -A
          git commit -m 'fix(auth): password registration and unified question cloud sync'
          git push origin HEAD:main
