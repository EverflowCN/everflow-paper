name: Build carfile extractor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-carfile-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build carfile-go
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/devcxm/carfile-go.git
          cd carfile-go
          go build -trimpath -ldflags='-s -w' -o carfile ./cmd/carfile
          ./carfile -h
      - name: Upload extractor
        uses: actions/upload-artifact@v4
        with:
          name: carfile-linux-amd64
          path: carfile-go/carfile
          if-no-files-found: error
          retention-days: 1
