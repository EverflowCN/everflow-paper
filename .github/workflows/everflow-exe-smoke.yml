name: Everflow EXE -> XeLaTeX -> PDF Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - everflow-exe-smoke
    paths:
      - 'exe-smoke/**'
      - '.github/workflows/everflow-exe-smoke.yml'

permissions:
  contents: write

jobs:
  windows-exe-pdf:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: exe-smoke/src-tauri

      - name: Install frontend build dependencies
        working-directory: exe-smoke
        shell: pwsh
        run: |
          npm install
          npm run tauri icon app-icon.svg
          node --version
          npm --version
          rustc --version
          cargo --version
          if (-not (Test-Path 'src-tauri/icons/icon.ico')) { throw 'Tauri icon generation did not create icon.ico' }

      - name: Build real Tauri EXE and NSIS installer
        working-directory: exe-smoke
        shell: pwsh
        run: |
          if (-not (Select-String -Path 'dist/index.html' -Pattern 'LaTeX 试卷工作台' -Quiet)) { throw 'Production Everflow desktop UI is missing.' }
          npm run tauri build -- --bundles nsis
          Write-Host '--- release executables ---'
          Get-ChildItem 'src-tauri/target/release' -Filter '*.exe' | Select-Object Name, Length, FullName
          Write-Host '--- NSIS installers ---'
          Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' | Select-Object Name, Length, FullName

      - name: Install MiKTeX for EXE-driven compile
        shell: pwsh
        run: |
          choco install miktex.install --yes --no-progress --params '"/Set:basic"'
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv

          $cmd = Get-Command xelatex.exe -ErrorAction SilentlyContinue
          if (-not $cmd) {
            $roots = @(
              'C:\Program Files\MiKTeX\miktex\bin\x64',
              "$env:LOCALAPPDATA\Programs\MiKTeX\miktex\bin\x64"
            )
            foreach ($dir in $roots) {
              if (Test-Path (Join-Path $dir 'xelatex.exe')) {
                $env:PATH = "$dir;$env:PATH"
                $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                break
              }
            }
          } else {
            $cmd.Source | Split-Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          initexmf '--set-config-value=[MPM]AutoInstall=yes'
          mpm --update-db
          initexmf --update-fndb
          xelatex --version

      - name: Run Everflow.exe and let EXE compile PDF
        working-directory: exe-smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $compileStartedAt = Get-Date

          $preferred = 'src-tauri/target/release/Everflow.exe'
          if (Test-Path $preferred) {
            $exe = Get-Item $preferred
          } else {
            $exe = Get-ChildItem 'src-tauri/target/release' -Filter '*.exe' |
              Where-Object { $_.FullName -notmatch '\\bundle\\' } |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          if (-not $exe) { throw 'No built Everflow executable found.' }
          Write-Host "RUNNING_EXE=$($exe.FullName)"

          $pdf = Join-Path $PWD 'artifacts/Everflow-EXE-self-test.pdf'
          & $exe.FullName --self-test-compile --output $pdf 2>&1 | Tee-Object -FilePath 'artifacts/exe-self-test.log'
          if ($LASTEXITCODE -ne 0) { throw "Everflow.exe self-test returned exit code $LASTEXITCODE" }
          if (-not (Test-Path $pdf)) { throw 'Everflow.exe did not create the expected PDF.' }

          $selfTestLog = Get-Content 'artifacts/exe-self-test.log' -Raw
          if ($selfTestLog -notmatch 'EVERFLOW_XELATEX_RESOLVED=') { throw 'EXE log lacks the resolved XeLaTeX path marker.' }
          if ($selfTestLog -notmatch 'EVERFLOW_XELATEX_START=pass=1;') { throw 'EXE log lacks the first XeLaTeX invocation marker.' }
          if ($selfTestLog -notmatch 'EVERFLOW_XELATEX_EXIT=pass=2;code=0') { throw 'EXE log lacks a successful second XeLaTeX pass marker.' }
          if ($selfTestLog -notmatch 'EVERFLOW_EXE_COMPILE_OK=') { throw 'EXE log lacks its PDF success marker.' }

          $pdfInfo = Get-Item $pdf
          if ($pdfInfo.Length -lt 1000) { throw "EXE-created PDF is unexpectedly small: $($pdfInfo.Length) bytes" }
          if ($pdfInfo.LastWriteTime -lt $compileStartedAt) { throw 'PDF predates the Everflow.exe invocation.' }
          $pdfMagic = [System.IO.File]::ReadAllBytes($pdf)[0..4]
          if ([System.Text.Encoding]::ASCII.GetString($pdfMagic) -ne '%PDF-') { throw 'EXE-created output does not have a PDF header.' }
          $pdfHash = (Get-FileHash $pdf -Algorithm SHA256).Hash
          Write-Host "EXE_GENERATED_PDF_SHA256=$pdfHash"

          $fixture = Join-Path $PWD 'fixtures/basic-project'
          $projectOutput = Join-Path $env:RUNNER_TEMP 'Everflow-Question-Project-Output'
          New-Item -ItemType Directory -Force -Path $projectOutput | Out-Null
          & $exe.FullName --compile-project --project $fixture --entry 'question.tex' --output-dir $projectOutput 2>&1 |
            Tee-Object -FilePath 'artifacts/project-compile.log'
          if ($LASTEXITCODE -ne 0) { throw "Everflow.exe project compile returned exit code $LASTEXITCODE" }
          $projectLog = Get-Content 'artifacts/project-compile.log' -Raw
          if ($projectLog -notmatch 'EVERFLOW_EXE_PROJECT_COMPILE_OK=') { throw 'EXE project log lacks its success marker.' }
          if ($projectLog -notmatch 'EVERFLOW_XELATEX_EXIT=pass=2;code=0') { throw 'EXE project log lacks a successful second XeLaTeX pass.' }
          $projectPdf = Join-Path $projectOutput 'question.pdf'
          if (-not (Test-Path $projectPdf)) { throw 'Everflow.exe did not create question.pdf from the fixture project.' }
          if ([System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($projectPdf)[0..4]) -ne '%PDF-') {
            throw 'EXE-created question project output does not have a PDF header.'
          }
          Copy-Item $projectPdf 'artifacts/Everflow-question-project.pdf'
          Write-Host "EXE_PROJECT_PDF_SHA256=$((Get-FileHash $projectPdf -Algorithm SHA256).Hash)"

          Copy-Item $exe.FullName 'artifacts/Everflow.exe'
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup.exe was not produced.' }

          $customInstall = Join-Path $env:RUNNER_TEMP 'Everflow-Custom-Install'
          $installProcess = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$customInstall") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "NSIS custom-directory install returned exit code $($installProcess.ExitCode)" }
          $installedExe = Join-Path $customInstall 'Everflow.exe'
          if (-not (Test-Path $installedExe)) { throw "NSIS did not install Everflow.exe into custom directory: $customInstall" }
          @(
            "NSIS_CUSTOM_INSTALL_OK=$customInstall"
            "INSTALLED_EXE_SHA256=$((Get-FileHash $installedExe -Algorithm SHA256).Hash)"
          ) | Set-Content 'artifacts/nsis-custom-install-proof.txt' -Encoding utf8

          Copy-Item $setup.FullName 'artifacts/Everflow-1.3.0-x64-setup.exe'

          Get-Item 'artifacts/Everflow.exe','artifacts/Everflow-1.3.0-x64-setup.exe',$pdf,'artifacts/Everflow-question-project.pdf','artifacts/nsis-custom-install-proof.txt' |
            Select-Object Name, Length, LastWriteTime

      - name: Upload EXE + setup + EXE-generated PDF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Everflow-Windows-v1.3.0
          path: exe-smoke/artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish directly downloadable Windows release
        if: success()
        working-directory: exe-smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.3.0'
          $assets = @(
            'artifacts/Everflow-1.3.0-x64-setup.exe',
            'artifacts/Everflow.exe',
            'artifacts/Everflow-question-project.pdf',
            'artifacts/project-compile.log'
          )

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'Everflow 1.3.0 Windows' `
              --notes '正式 Windows x64 版本。包含支持自定义安装目录的 NSIS 安装包、便携版 Everflow.exe，以及由 Everflow.exe 自己调用 XeLaTeX 生成的验收 PDF 和真实编译日志。'
          }

          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publish failed with exit code $LASTEXITCODE" }
