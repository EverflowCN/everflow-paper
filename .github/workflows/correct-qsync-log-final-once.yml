name: Correct qsync fix log final once

on:
  push:
    paths:
      - '.github/workflows/correct-qsync-log-final-once.yml'

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Correct final qsync log
        run: python .github/scripts/correct_qsync_log_final.py
      - name: Commit log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Everflow Maintenance'
          git config user.email '54564601+EverflowCN@users.noreply.github.com'
          git add docs/FIX_LOG.md
          git commit -m 'docs: record final dirty-batch sync strategy'
          git push origin HEAD:main
