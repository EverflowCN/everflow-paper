name: Crop 2025 Q42 original figure

on:
  push:
    paths:
      - '.github/workflows/crop-2025-q42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF/image dependencies
        run: pip install --quiet pymupdf pillow requests
      - name: Download authoritative public original and crop Q42 figure
        run: |
          python - <<'PY'
          import io, os, requests, fitz
          from PIL import Image, ImageChops

          url = 'https://www.xit.edu.cn/_upload/article/files/c1/ce/26986f79493495bbaacba9738587/d9fce855-72bd-4e00-9a48-5d4ec5ef6f72.pdf'
          r = requests.get(url, timeout=60)
          r.raise_for_status()
          doc = fitz.open(stream=r.content, filetype='pdf')
          page = doc[7]  # printed page 7, PDF index 7
          pix = page.get_pixmap(matrix=fitz.Matrix(3, 3), alpha=False)
          img = Image.frombytes('RGB', [pix.width, pix.height], pix.samples)

          # Tight region containing only the AOE network figure; coordinates were
          # verified against the public original scan at 3x PDF scale.
          crop = img.crop((640, 1725, 1215, 2015))

          # Trim only outer near-white margins; preserve all original labels,
          # values, line directions and anti-aliasing inside the source crop.
          bg = Image.new('RGB', crop.size, 'white')
          diff = ImageChops.difference(crop, bg).convert('L')
          diff = diff.point(lambda p: 255 if p > 18 else 0)
          box = diff.getbbox()
          if box:
              pad = 12
              l,t,r,b = box
              box = (max(0,l-pad), max(0,t-pad), min(crop.width,r+pad), min(crop.height,b+pad))
              crop = crop.crop(box)

          out = 'site/data/zhenti/assets/2025/q42-aoe-original.png'
          os.makedirs(os.path.dirname(out), exist_ok=True)
          crop.save(out, 'PNG', optimize=True)
          print('saved', out, crop.size)
          PY
      - name: Commit cropped original figure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/zhenti/assets/2025/q42-aoe-original.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add original 2025 Q42 AOE figure crop'
          git push
