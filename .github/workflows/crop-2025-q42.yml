name: Crop remaining original 408 figures

on:
  push:
    paths:
      - '.github/workflows/crop-2025-q42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF/image dependencies
        run: pip install --quiet pymupdf pillow requests
      - name: Crop exact 2016 original-paper figures and localize supplements
        run: |
          python - <<'PY'
          import os, json, pathlib, requests, fitz
          from PIL import Image, ImageChops

          root=pathlib.Path('site/data/zhenti')
          url='https://www.xit.edu.cn/_upload/article/files/c1/ce/26986f79493495bbaacba9738587/a62b9584-568c-4139-aaa8-3cba0bfc8f80.pdf'
          r=requests.get(url,timeout=60); r.raise_for_status()
          doc=fitz.open(stream=r.content,filetype='pdf')
          outdir=root/'assets'/'2016'; outdir.mkdir(parents=True,exist_ok=True)
          jobs=[
            (0,(380,1930,1460,2280),'q03-tracks-original.png'),
            (1,(730,430,1050,900),'q06-dfs-graph-original.png'),
            (1,(560,1070,1230,1510),'q08-dijkstra-original.png'),
            (2,(620,1060,1210,1280),'q17-instruction-format-original.png'),
            (4,(590,420,1240,640),'q29-workset-timeline-original.png'),
            (5,(280,160,1490,1010),'q33-41-network-topology-original.png'),
            (6,(430,1730,1460,2230),'q44-interrupt-timing-original.png'),
            (7,(200,180,1600,930),'q45-vm-cache-original.png'),
            (7,(480,1700,1370,2200),'q47-directory-fat-original.png'),
          ]
          rendered={}
          def trim(crop):
            bg=Image.new('RGB',crop.size,'white')
            diff=ImageChops.difference(crop,bg).convert('L').point(lambda p:255 if p>18 else 0)
            box=diff.getbbox()
            if not box:return crop
            pad=14; l,t,rr,b=box
            return crop.crop((max(0,l-pad),max(0,t-pad),min(crop.width,rr+pad),min(crop.height,b+pad)))
          for page_no,box,name in jobs:
            if page_no not in rendered:
              pix=doc[page_no].get_pixmap(matrix=fitz.Matrix(3,3),alpha=False)
              rendered[page_no]=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
            trim(rendered[page_no].crop(box)).save(outdir/name,'PNG',optimize=True)

          sp=root/'supplement'/'2016.json'
          data=json.loads(sp.read_text(encoding='utf-8'))
          mapping={
            '3':'q03-tracks-original.png','6':'q06-dfs-graph-original.png','8':'q08-dijkstra-original.png',
            '17':'q17-instruction-format-original.png','29':'q29-workset-timeline-original.png',
            **{str(i):'q33-41-network-topology-original.png' for i in range(33,42)},
            '44':'q44-interrupt-timing-original.png','45':'q45-vm-cache-original.png','47':'q47-directory-fat-original.png'
          }
          for qnum,name in mapping.items():
            q=data['questions'][qnum]
            q['figures']=[{
              'src':f'/data/zhenti/assets/2016/{name}',
              'alt':f'2016年第{qnum}题原卷必要图表',
              'caption':'截取自厦门工学院公开的2016年408原卷，仅保留本题作答所需图表区域。'
            }]
            q['verification']={'status':'verified','mode':'authoritative-original-scan-crop','sources':['xit','csgraduates','csyanku']}
          data['verifiedAt']='2026-08-24'
          sp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest_path=root/'manifest.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          y=manifest['years']['2016']
          y['contentStatus']='verified'; y['paperStatus']='verified'; y['questionCount']=47; y['verifiedQuestions']=list(range(1,48))
          y['sources']=list(dict.fromkeys(y.get('sources',[])+['xit','csgraduates','csyanku']))
          y['notes']='47/47 verified. All previously missing figure/topology questions now use tight local crops from the public 2016 original-paper scan; supplements fill missing questions while base-year JSON remains authoritative.'
          manifest['updatedAt']='2026-08-24T08:10:00+08:00'
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          overlay=pathlib.Path('site/assets/js/zhenti-data-overlay.js')
          text=overlay.read_text(encoding='utf-8')
          assert 'for(const source of [extra,supplement,base])' in text, 'base-year precedence regressed'
          import re
          text=re.sub(r"const DATA_VERSION='[^']+';", "const DATA_VERSION='20260824-2016-original-crops-d';", text)
          overlay.write_text(text,encoding='utf-8')

          for p in sorted(root.glob('*.json'))+sorted((root/'supplement').glob('*.json')):
            json.loads(p.read_text(encoding='utf-8'))
          for name in mapping.values(): assert (outdir/name).is_file(), name
          PY
      - name: Commit verified 2016 crop batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/zhenti/assets/2016 site/data/zhenti/supplement/2016.json site/data/zhenti/manifest.json site/assets/js/zhenti-data-overlay.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use original-paper crops for verified 2016 questions'
          git push
