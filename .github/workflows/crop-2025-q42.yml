name: Crop remaining original 408 figures

on:
  push:
    paths:
      - '.github/workflows/crop-2025-q42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF/image dependencies
        run: pip install --quiet pymupdf pillow requests
      - name: Crop exact 2024 original-paper figures
        run: |
          python - <<'PY'
          import os, requests, fitz
          from PIL import Image, ImageChops

          url='https://www.xit.edu.cn/_upload/article/files/c1/ce/26986f79493495bbaacba9738587/6b611f5c-55d9-4612-8ff9-30b028731314.pdf'
          r=requests.get(url,timeout=60); r.raise_for_status()
          doc=fitz.open(stream=r.content,filetype='pdf')
          outdir='site/data/zhenti/assets/2024'; os.makedirs(outdir,exist_ok=True)

          # (page index, crop box at 3x PDF render, output file)
          jobs=[
            (0,(580,1790,1310,2165),'q04-adjacency-multilist-original.png'),
            (1,(820,770,1225,1185),'q07-bst-original.png'),
            (5,(830,1040,1515,1595),'q33-packet-network-original.png'),
            (6,(245,115,1545,800),'q35-vlan-switch-original.png'),
            (6,(675,1140,1245,1925),'q37-sr-timeline-original.png'),
            (9,(190,135,1590,935),'q43-instruction-format-original.png'),
            (9,(260,1000,1575,1870),'q43-datapath-original.png'),
            (11,(355,1170,1285,1705),'q44-memory-table-original.png'),
            (14,(325,465,1470,1305),'q47-as-topology-original.png'),
          ]

          rendered={}
          def trim(crop):
            bg=Image.new('RGB',crop.size,'white')
            diff=ImageChops.difference(crop,bg).convert('L').point(lambda p:255 if p>18 else 0)
            box=diff.getbbox()
            if not box:return crop
            pad=14; l,t,rr,b=box
            return crop.crop((max(0,l-pad),max(0,t-pad),min(crop.width,rr+pad),min(crop.height,b+pad)))

          for page_no,box,name in jobs:
            if page_no not in rendered:
              pix=doc[page_no].get_pixmap(matrix=fitz.Matrix(3,3),alpha=False)
              rendered[page_no]=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
            crop=trim(rendered[page_no].crop(box))
            path=os.path.join(outdir,name)
            crop.save(path,'PNG',optimize=True)
            print(name,crop.size)
          PY
      - name: Commit exact crops
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/zhenti/assets/2024/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add original 2024 missing-question figure crops'
          git push
