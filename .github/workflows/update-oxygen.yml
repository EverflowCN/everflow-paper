name: Sync 氧气11 408强化

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_oxygen.py"
      - ".github/workflows/update-oxygen.yml"

permissions:
  contents: write

concurrency:
  group: oxygen-408-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Bilibili courses
        run: python scripts/update_oxygen.py

      - name: Commit updated course data
        shell: bash
        run: |
          if git diff --quiet -- site/data/oxygen.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "everflow-bot"
          git config user.email "54564601+EverflowCN@users.noreply.github.com"
          git add site/data/oxygen.json
          git commit -m "Auto-sync 氧气11 408强化"
          git push
