name: Sync 氧气11 408强化

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_oxygen.py"
      - "scripts/cleanup_oxygen.py"
      - ".github/workflows/update-oxygen.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: oxygen-408-sync
  cancel-in-progress: true

jobs:
  fetch:
    name: Fetch ${{ matrix.subject }}
    strategy:
      fail-fast: false
      matrix:
        subject: [ds, co, os, cn]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch one subject from Bilibili
        run: |
          mkdir -p sync
          python scripts/update_oxygen.py --subject "${{ matrix.subject }}" --output "sync/${{ matrix.subject }}.json"

      - name: Upload subject result
        uses: actions/upload-artifact@v4
        with:
          name: oxygen-${{ matrix.subject }}
          path: sync/${{ matrix.subject }}.json
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge course data
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download subject results
        uses: actions/download-artifact@v4
        with:
          pattern: oxygen-*
          path: sync
          merge-multiple: true

      - name: Merge without deleting failed-subject data
        run: python scripts/update_oxygen.py --merge-dir sync

      - name: Normalize confirmed title aliases
        run: python scripts/cleanup_oxygen.py

      - name: Commit updated course data
        id: commit_data
        shell: bash
        run: |
          if git diff --quiet -- site/data/oxygen.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
            exit 0
          fi
          git config user.name "everflow-bot"
          git config user.email "54564601+EverflowCN@users.noreply.github.com"
          git add site/data/oxygen.json
          git commit -m "Auto-sync 氧气11 408强化"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 产生的 push 默认不会再次触发 deploy-pages 的 push 事件，
      # 所以数据变化后显式 dispatch Pages，确保 evera.top 立即拿到最新 oxygen.json。
      - name: Deploy updated data to GitHub Pages
        if: steps.commit_data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
