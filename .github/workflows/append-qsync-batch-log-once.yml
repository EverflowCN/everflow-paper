name: Append qsync batch fix log once

on:
  push:
    paths:
      - '.github/workflows/append-qsync-batch-log-once.yml'

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Append fix log
        run: python .github/scripts/append_qsync_batch_log.py
      - name: Commit log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Everflow Maintenance'
          git config user.email '54564601+EverflowCN@users.noreply.github.com'
          git add docs/FIX_LOG.md
          git commit -m 'docs: record batched question cloud sync rollout'
          git push origin HEAD:main
