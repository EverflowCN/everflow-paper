name: Everflow archive CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand private source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f everflow-private-github-ready.zip
          unzip -oq everflow-private-github-ready.zip -d . -x '.devcontainer/*' '.github/*'
          rm -rf .runtime dist node_modules demo-output
          rm -f .env
      - name: Verify latest main dashboard patch
        shell: bash
        run: |
          set -euo pipefail
          node .devcontainer/patch-codespaces-auth.js
          test -f apps/web/static/site/site.js
          node --check apps/web/static/site/site.js
          grep -q 'codespacesAuthFallback' apps/web/static/site/site.js
          grep -q 'fallbackUser()' apps/web/static/site/site.js
          grep -q 'function pageHead(' apps/web/static/site/site.js
          echo 'pageHead patch verified against private archive'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Core API smoke test
        shell: bash
        run: |
          set -euo pipefail
          EVERFLOW_PERSISTENCE=file PORT=8787 npm run api >/tmp/everflow-api.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/everflow-api.log
          exit 1
