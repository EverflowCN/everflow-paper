name: Everflow archive CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand private source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f everflow-private-github-ready.zip
          unzip -oq everflow-private-github-ready.zip -d . -x '.devcontainer/*' '.github/*'
          rm -rf .runtime dist node_modules demo-output
          rm -f .env
      - name: Diagnose patched dashboard and quota helpers
        shell: bash
        run: |
          set -euo pipefail
          node .devcontainer/patch-codespaces-auth.js
          node <<'NODE'
          const fs=require('fs');
          const p='apps/web/static/site/site.js';
          const s=fs.readFileSync(p,'utf8');
          const lines=s.split(/\r?\n/);
          for(const [line,col] of [[89,463],[207,665]]){
            const text=lines[line-1]||'';
            const a=Math.max(0,col-1-360), b=Math.min(text.length,col-1+360);
            console.log(`=== PATCHED POSITION ${line}:${col} lineLength=${text.length} ===`);
            console.log(text.slice(a,b));
            console.log(`=== CARET ${' '.repeat(Math.max(0,col-1-a))}^ ===`);
          }
          for(const name of ['dashboard','quotaUsed','quotaRemain','effectivePlan','pageHead','shell','wireCommon']){
            const candidates=[`function ${name}`,`async function ${name}`];
            let idx=-1;
            for(const c of candidates){idx=s.indexOf(c);if(idx>=0)break;}
            console.log(`=== FUNCTION ${name} INDEX ${idx} ===`);
            if(idx>=0){
              const end=s.indexOf('\nfunction ',idx+1);
              console.log(s.slice(idx,end>idx?Math.min(end,idx+5000):idx+5000));
            }
          }
          NODE
      - name: Verify Codespaces dashboard auth patch
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/static/site/site.js
          node --check apps/web/static/site/site.js
          grep -q 'codespacesAuthFallback' apps/web/static/site/site.js
          grep -q 'fallbackUser()' apps/web/static/site/site.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Core API smoke test
        shell: bash
        run: |
          set -euo pipefail
          EVERFLOW_PERSISTENCE=file PORT=8787 npm run api >/tmp/everflow-api.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/everflow-api.log
          exit 1
