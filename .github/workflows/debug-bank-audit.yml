name: Debug bank audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-bank-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Existing v2 architecture audit
        run: node site/tools/audit-bank-features.mjs
      - name: Subject index audit
        run: node site/tools/build-zhenti-subject-index.mjs --check
      - name: True-paper bank audit
        run: node site/tools/audit-question-banks.mjs --skip-relax
      - name: New reader contract
        run: |
          set -euo pipefail
          grep -q 'relax-reader-nav-group' site/assets/js/relax1000-reader.js
          grep -q 'chapterOrder' site/assets/js/relax1000-reader.js
          grep -q "event.key==='1'" site/assets/js/relax1000-reader.js
          grep -q 'relax1000-reader-nav-v2.css' site/zhenti/relax-reader/index.html
          node --check site/assets/js/relax1000-reader.js
      - name: New graph answer contract
        run: |
          set -euo pipefail
          grep -q 'data-graph-submit' site/assets/js/graph-answer-enhancements.js
          grep -q 'if(q>40)return null' site/assets/js/graph-answer-enhancements.js
          grep -q 'graph-answer-enhancements.js' site/graph/index.html
          node --check site/assets/js/graph-answer-enhancements.js
