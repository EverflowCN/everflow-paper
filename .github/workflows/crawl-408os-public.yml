name: Temporary Relax1000 final package

on:
  push:
    branches:
      - crawl-408os-relax1000-20260921

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Everflow tools
        uses: actions/checkout@v6
        with:
          ref: crawl-408os-relax1000-20260921

      - name: Checkout Relax1000 source
        uses: actions/checkout@v6
        with:
          repository: EverflowCN/408-exercise-paper-generator
          ref: main
          path: .relax-source
          sparse-checkout: |
            站点/data
            站点/question-images
            站点/explanations
          sparse-checkout-cone-mode: false

      - name: Build audited Relax1000 package
        run: |
          set -euo pipefail
          python scratch/408os-crawl/build_relax_final_package.py
          cd package
          zip -r -9 ../Relax1000-Everflow-Final.zip Relax1000-Everflow-Final >/dev/null
          cd ..
          echo "=== AUDIT ==="
          cat package/Relax1000-Everflow-Final/data/audit_report.json
          echo "=== ZIP ==="
          ls -lh Relax1000-Everflow-Final.zip

      - name: Upload final Relax1000 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Relax1000-Everflow-Final
          path: Relax1000-Everflow-Final.zip
          if-no-files-found: error
          retention-days: 7
