name: Temporary 408os public crawl probe

on:
  push:
    branches:
      - crawl-408os-relax1000-20260921
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0 crawl4ai==0.9.3
          python -m playwright install --with-deps chromium
      - name: Probe public 408os routes and requests
        run: |
          python scratch/408os-crawl/probe.py
      - name: Scan public Relax1000 frontend assets
        run: |
          python scratch/408os-crawl/scan_relax_assets.py
      - name: Verify Crawl4AI public crawl
        run: |
          python scratch/408os-crawl/crawl4ai_probe.py
      - name: Show probe summaries
        if: always()
        run: |
          test -f crawl-output/probe.json && cat crawl-output/probe.json || true
          test -f crawl-output/relax-static-scan.json && cat crawl-output/relax-static-scan.json || true
          test -f crawl-output/crawl4ai-probe.json && cat crawl-output/crawl4ai-probe.json || true
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 408os-public-probe
          path: crawl-output/
          if-no-files-found: warn
          retention-days: 3

      - name: Checkout Relax1000 source
        uses: actions/checkout@v6
        with:
          repository: EverflowCN/408-exercise-paper-generator
          ref: main
          path: .relax-source
          sparse-checkout: |
            站点/data
            站点/question-images
            站点/explanations
          sparse-checkout-cone-mode: false

      - name: Build audited Relax1000 package
        run: |
          set -euo pipefail
          python scratch/408os-crawl/build_relax_final_package.py
          cd package
          zip -r -9 ../Relax1000-Everflow-Final.zip Relax1000-Everflow-Final >/dev/null
          cd ..
          echo "=== AUDIT ==="
          cat package/Relax1000-Everflow-Final/data/audit_report.json
          echo "=== ZIP ==="
          ls -lh Relax1000-Everflow-Final.zip

      - name: Upload final Relax1000 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Relax1000-Everflow-Final
          path: Relax1000-Everflow-Final.zip
          if-no-files-found: error
          retention-days: 7
