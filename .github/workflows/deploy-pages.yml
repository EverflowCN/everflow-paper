name: Deploy Everflow Blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # Pages 部署只负责发布已经提交到 site/ 的静态文件。
      # 氧气课程同步会更新 site/data/oxygen.json，并显式 dispatch 本工作流。
      # 不再让无关的 LL880 构建/校验阻塞课程数据上线。
      - name: Verify oxygen data exists
        shell: bash
        run: |
          test -s site/data/oxygen.json
          python - <<'PY'
          import json
          p = 'site/data/oxygen.json'
          with open(p, 'r', encoding='utf-8') as f:
              d = json.load(f)
          assert d.get('updatedAt'), 'oxygen.json missing updatedAt'
          for key in ('ds', 'co', 'os', 'cn'):
              assert key in d.get('subjects', {}), f'missing subject: {key}'
          print('oxygen.json OK:', d.get('updatedAt'))
          PY

      - name: Audit bank features
        shell: bash
        run: node site/tools/audit-bank-features.mjs

      - name: Audit all 846 408 questions
        id: zhenti_audit
        continue-on-error: true
        shell: bash
        run: |
          node site/tools/audit-zhenti.mjs
          python - <<'PY'
          import json
          p = 'site/data/zhenti/audit-report.json'
          with open(p, 'r', encoding='utf-8') as f:
              d = json.load(f)
          s = d['summary']
          print(f"zhenti audit healthy={s['healthy']}/{d['expectedQuestions']} unhealthy={s['unhealthy']} figureFailures={s['localFigureFailures']} manifestFailures={s.get('manifestFailures', 0)}")
          for year, info in d['years'].items():
              if info['badQuestions'] or info.get('manifestFailureCount'):
                  print(year, 'bad:', ','.join(map(str, info['badQuestions'])), 'manifest:', info.get('manifestFailureCount', 0))
          PY

      - name: Persist audit report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/zhenti/audit-report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(zhenti): refresh audit report [skip ci]"
            git push origin HEAD:main
          fi

      - name: Require healthy 408 corpus
        if: steps.zhenti_audit.outcome == 'failure'
        shell: bash
        run: |
          echo '408 corpus audit failed; refusing to deploy Pages.'
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
