name: Deploy Everflow Blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build LL880 static simulation pages
        run: node scripts/build-ll880-static.mjs

      - name: Verify LL880 static output
        shell: bash
        run: |
          PAGE="site/study/practice/math-880/simulations.html"
          XLS="site/study/practice/math-880/downloads/ll880-math2-24-papers.xls"
          test -s "$PAGE"
          test -s "$XLS"
          ! grep -q "24套数据读取失败" "$PAGE"
          ! grep -q "正在读取 24 套逐题数据" "$PAGE"
          COUNT=$(grep -o 'class="sim880-card"' "$PAGE" | wc -l | tr -d ' ')
          if [ "$COUNT" != "24" ]; then
            echo "Expected 24 static paper cards, got $COUNT"
            exit 1
          fi
          DETAIL_COUNT=$(grep -o '<summary>查看 22 题逐题表</summary>' "$PAGE" | wc -l | tr -d ' ')
          if [ "$DETAIL_COUNT" != "24" ]; then
            echo "Expected 24 static detail tables, got $DETAIL_COUNT"
            exit 1
          fi
          echo "LL880 static output OK: 24 cards / 24 detail tables / 528 mapped questions"

      # 关键：把“构建完成后的 HTML”本身回写 main。
      # 这样无论生产域名由 GitHub Pages、仓库镜像还是其它纯静态托管读取，
      # 都不需要在浏览器运行 fetch，也不需要托管端执行 Node 才能看到 24 套数据。
      - name: Persist LL880 pre-rendered output to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/study/practice/math-880/simulations.html \
            site/study/practice/math-880/downloads/ll880-math2-24-papers.xls
          if ! git diff --cached --quiet; then
            git commit -m "chore(math880): persist static 24-set output"
            git push origin HEAD:main
          else
            echo "LL880 static output already persisted in main."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
