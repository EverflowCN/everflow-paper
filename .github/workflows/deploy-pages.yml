name: Deploy Everflow Blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 24 套仿真卷数据在仓库中保留 gzip+base64 文本版本，
      # 部署时解出普通 JSON，避免浏览器端依赖 DecompressionStream。
      - name: Materialize LL880 simulation JSON
        shell: bash
        run: |
          SRC="site/data/practice/math2-lilin880-24sets.json.gz.b64"
          OUT="site/data/practice/math2-lilin880-24sets.json"
          if [ -f "$SRC" ]; then
            tr -d '\r\n ' < "$SRC" | base64 --decode | gzip -dc > "$OUT"
            python - <<'PY'
          import json
          path = "site/data/practice/math2-lilin880-24sets.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          sets = data.get("sets", [])
          if len(sets) != 24 or any(len(x.get("questions", [])) != 22 for x in sets):
              raise SystemExit("LL880 simulation data validation failed")
          print("LL880 simulation data OK:", len(sets), "papers")
          PY
          fi

      # 将解包后的普通 JSON 尝试同步回 main。
      # 这样即便 evera.top 不是直接读取本次 Pages artifact，而是读取仓库静态文件，
      # 24 套数据仍然真实存在于仓库路径中。推送失败不会阻断 Pages 部署。
      - name: Persist LL880 plain JSON to repository
        shell: bash
        run: |
          OUT="site/data/practice/math2-lilin880-24sets.json"
          if [ -f "$OUT" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$OUT"
            if ! git diff --cached --quiet; then
              git commit -m "chore(math880): persist generated 24-set JSON" || true
              git push origin HEAD:main || echo "WARN: unable to persist generated LL880 JSON; Pages artifact still contains it"
            fi
          fi

      # 旧版 Excel 分片若仍存在，则恢复为可下载文件；不存在时不影响部署。
      - name: Materialize downloadable Excel assets
        shell: bash
        run: |
          PART_DIR="site/study/practice/math-880/downloads/ll880-24"
          OUT="site/study/practice/math-880/downloads/ll880-math2-24-papers.xlsx"
          if [ ! -f "$OUT" ] && compgen -G "$PART_DIR/part-*.b64" > /dev/null; then
            cat "$PART_DIR"/part-*.b64 | tr -d '\r\n ' | base64 --decode > "$OUT"
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
