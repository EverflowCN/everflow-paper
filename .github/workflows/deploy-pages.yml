name: Deploy Everflow Blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LL880 static simulation pages
        run: node scripts/build-ll880-static.mjs

      - name: Verify LL880 static output
        shell: bash
        run: |
          PAGE="site/study/practice/math-880/simulations.html"
          XLS="site/study/practice/math-880/downloads/ll880-math2-24-papers.xls"
          test -s "$PAGE"
          test -s "$XLS"
          ! grep -q "24套数据读取失败" "$PAGE"
          ! grep -q "正在读取 24 套逐题数据" "$PAGE"
          COUNT=$(grep -o 'class="sim880-card"' "$PAGE" | wc -l | tr -d ' ')
          if [ "$COUNT" != "24" ]; then
            echo "Expected 24 static paper cards, got $COUNT"
            exit 1
          fi
          ROWS=$(grep -o 'data-paper="[0-9][0-9]*"' "$PAGE" | wc -l | tr -d ' ')
          echo "LL880 static cards: $COUNT"
          echo "LL880 data-paper markers: $ROWS"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
