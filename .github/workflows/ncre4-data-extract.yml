name: NCRE4 Data Extract

on:
  push:
    branches:
      - ncre4-data-extract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/ZMQL16lab/ncre4-network-exam/main/danxuan.json \
            -o data/danxuan.json
          curl -fL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/ZMQL16lab/ncre4-network-exam/main/duoxuan.json \
            -o data/duoxuan.json

          PROFILE='https://www.xiaohongshu.com/user/profile/68f76acf0000000037007d4b?channel_type=web_note_detail_r10&parent_page_channel_type=web_profile_board&xsec_token=ABF1gQWTZCWWxH9SNNov1mRi_LOrsnu9x-1CGh-sbEleE=&xsec_source=pc_user'
          curl -L --retry 2 --max-time 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
            -H 'Accept-Language: zh-CN,zh;q=0.9' \
            "$PROFILE" -D data/xhs-headers.txt -o data/xhs-profile.html || true

          python - <<'PY'
          import json,re,html
          from collections import Counter, defaultdict
          from pathlib import Path

          singles=json.loads(Path('data/danxuan.json').read_text(encoding='utf-8'))
          multis=json.loads(Path('data/duoxuan.json').read_text(encoding='utf-8'))
          report=[]
          for label, rows in [('single',singles),('multi',multis)]:
              report.append(f'{label}_total={len(rows)}')
              by_subject=Counter(str(r.get('km','')) for r in rows)
              for k,v in sorted(by_subject.items()): report.append(f'{label}_subject[{k}]={v}')
              th=defaultdict(set)
              for r in rows: th[str(r.get('km',''))].add(str(r.get('th','')))
              for k,vals in sorted(th.items()):
                  nums=sorted((int(x) for x in vals if x.isdigit()))
                  report.append(f'{label}_sets[{k}]={nums}')

          p=Path('data/xhs-profile.html')
          if p.exists():
              raw=p.read_text(encoding='utf-8',errors='ignore')
              report.append(f'xhs_html_bytes={p.stat().st_size}')
              report.append(f'xhs_contains_keyword={"计算机四级" in raw}')
              # collect visible/serialized titles containing 真题
              normalized=html.unescape(raw).replace('\\u8ba1\\u7b97\\u673a','计算机').replace('\\u56db\\u7ea7','四级').replace('\\u7f51\\u7edc','网络').replace('\\u771f\\u9898','真题')
              hits=[]
              for m in re.finditer(r'.{0,80}计算机四级.{0,120}', normalized):
                  s=re.sub(r'<[^>]+>',' ',m.group(0))
                  s=re.sub(r'\\s+',' ',s).strip()
                  if s not in hits: hits.append(s)
              Path('data/xhs-keyword-hits.txt').write_text('\n'.join(hits[:500]),encoding='utf-8')
              report.append(f'xhs_keyword_hits={len(hits)}')
          Path('data/report.txt').write_text('\n'.join(report),encoding='utf-8')
          print('\n'.join(report))
          PY

      - name: Upload source data
        uses: actions/upload-artifact@v4
        with:
          name: ncre4-source-json
          path: data/
          if-no-files-found: error
          retention-days: 3
