name: Build and deploy private FocusPomo

on:
  push:
    branches: [main]
    paths:
      - 'backend/focuspomo/**'
      - '.github/workflows/focus-private-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focus-private-bundle
  cancel-in-progress: true

jobs:
  build-focus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate FocusPomo source
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/focuspomo/app.js
          node --check backend/focuspomo/fruit-addon.js
          node --check site/me/focus/gate.js
          node --test \
            backend/focuspomo/engine.test.mjs \
            backend/focuspomo/fruit.test.mjs \
            backend/focuspomo/handler.test.mjs

      - name: Build private bundle
        shell: bash
        run: |
          set -euo pipefail
          node backend/focuspomo/build-bundle.mjs
          git diff --check
          grep -q "defaultFruit" supabase/functions/owner-focus/bundle.ts
          grep -q "assets/pear.svg" backend/focuspomo/fruit-addon.js
          grep -q "fruitSide" supabase/functions/owner-focus/engine.mjs

      - name: Deploy owner-focus when token is configured
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured; source and generated bundle will still be committed."
            exit 0
          fi
          npx --yes supabase@latest functions deploy owner-focus --project-ref xzodetdohinktagxuwhs

      - name: Commit generated private bundle
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/functions/owner-focus/bundle.ts supabase/functions/owner-focus/engine.mjs
          if git diff --cached --quiet; then
            echo "Generated bundle already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build private FocusPomo fruit bundle [skip ci]"
          git push origin HEAD:main
