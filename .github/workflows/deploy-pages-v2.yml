name: Deploy Everflow Site to GitHub Pages v2

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Architecture audit
        run: node site/tools/audit-bank-features.mjs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Checkout question assets
        uses: actions/checkout@v6
        with:
          repository: EverflowCN/408-exercise-paper-generator
          ref: main
          path: .relax-source
          sparse-checkout: |
            站点/data
            站点/question-images
            站点/explanations
          sparse-checkout-cone-mode: false

      - name: Verify site
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/zhenti/index.html
          test -s site/graph/index.html
          test -s site/relax/index.html
          test -s site/assets/js/graph-app.js
          test -s site/assets/js/graph-controls.js
          test -s site/assets/js/site-runtime-v2.js
          echo "Everflow source tree ready"

      - name: Build privacy-safe static artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site/data/relax1000
          mkdir -p site/data/relax1000
          cp -R ".relax-source/站点/data" site/data/relax1000/data
          cp -R ".relax-source/站点/question-images" site/data/relax1000/question-images
          cp -R ".relax-source/站点/explanations" site/data/relax1000/explanations

          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import unquote

          DROP_KEYS={
              'repository','repositoryurl','repo','repourl','github','githuburl',
              'sourceurl','sourcehref','rawurl','sourcewebsite','sourceaddress',
              'sources','sourceids','sourceid'
          }

          def scrub_string(value):
              if not isinstance(value,str):
                  return value
              lower=value.lower()
              if 'github.com' not in lower and 'raw.githubusercontent.com' not in lower:
                  return value
              decoded=unquote(value)
              for marker in ('/question-images/','/explanations/'):
                  if marker in decoded:
                      return marker.lstrip('/')+decoded.split(marker,1)[1]
              return ''

          def scrub(value):
              if isinstance(value,dict):
                  return {key:scrub(item) for key,item in value.items() if key.lower() not in DROP_KEYS}
              if isinstance(value,list):
                  return [scrub(item) for item in value]
              return scrub_string(value)

          for json_path in Path('site/data').rglob('*.json'):
              try:
                  data=json.loads(json_path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              data=scrub(data)
              if json_path.as_posix().endswith('relax1000/data/questions.json') and isinstance(data,dict):
                  meta=data.get('meta')
                  if isinstance(meta,dict):
                      for key in ('repository','repo','source','sourceUrl','github','githubUrl','questionCount'):
                          meta.pop(key,None)
              if json_path.as_posix().endswith('zhenti/manifest.json') and isinstance(data,dict):
                  data.pop('policy',None)
                  data.pop('sources',None)
                  for meta in (data.get('years') or {}).values():
                      if isinstance(meta,dict):
                          meta.pop('notes',None)
                          meta.pop('sources',None)
              json_path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          for name in ('audit-report.json','vendor-report.json'):
              p=Path('site/data/zhenti')/name
              if p.exists():
                  p.unlink()

          graph=Path('site/assets/js/overall-graph.js')
          if graph.exists():
              text=graph.read_text(encoding='utf-8')
              text=text.replace("if(/^https:\\/\\/raw\\.githubusercontent\\.com\\//i.test(value))return value;","")
              graph.write_text(text,encoding='utf-8')

          wall=Path('site/assets/js/zhenti-wall.js')
          if wall.exists():
              text=wall.read_text(encoding='utf-8')
              text=re.sub(r"const SOURCE_LABEL=\{.*?\};","const SOURCE_LABEL={};",text,count=1)
              text=re.sub(r"function sourceText\(item\)\{return .*?\}","function sourceText(){return'已核验'}",text,count=1)
              wall.write_text(text,encoding='utf-8')
          PY

          rm -rf site/tools

          if grep -RInEi --include='*.html' --include='*.js' --include='*.css' --include='*.json' 'EverflowCN|408-exercise-paper-generator|raw\.githubusercontent\.com/EverflowCN|TommyTay0712|408-exam-paper|CSYanKu|ForeverLink|Hermes 408' site; then
            echo 'Privacy audit failed: repository identity/address or bank-source details leaked into public artifact.'
            exit 1
          fi
          if grep -RIn --exclude-dir=data --include='*.html' --include='*.js' --include='*.css' '1576' site; then
            echo 'Privacy audit failed: exact Relax corpus count leaked into public UI/source.'
            exit 1
          fi

          test -s site/data/relax1000/data/questions.json
          test -s site/assets/js/graph-app.js
          test -s site/assets/js/graph-controls.js
          echo '{"build":"20260824-graph-r3"}' > site/build.json
          echo "Privacy-safe artifact ready"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
