name: Deploy Everflow Site to GitHub Pages v2

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Architecture audit
        shell: bash
        run: |
          set -euo pipefail
          node site/tools/audit-bank-features.mjs
          node site/tools/build-zhenti-subject-index.mjs --check
          node site/tools/audit-question-banks.mjs --skip-relax
          grep -q 'relax-reader-nav-group' site/assets/js/relax1000-reader.js
          grep -q 'chapterOrder' site/assets/js/relax1000-reader.js
          grep -q "event.key==='1'" site/assets/js/relax1000-reader.js
          grep -q 'data-graph-submit' site/assets/js/graph-answer-enhancements.js
          grep -q "if(q>40)return null" site/assets/js/graph-answer-enhancements.js
          grep -q 'relax1000-reader-nav-v2.css' site/zhenti/relax-reader/index.html
          grep -q 'graph-answer-enhancements.js' site/graph/index.html

      - name: Validate account, resource hub, workspace, and cache scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/assets/js/account.js \
            site/assets/js/admin-cloud.js \
            site/assets/js/cloud.js \
            site/assets/js/links.js \
            site/assets/js/checkin.js \
            site/assets/js/course-catalog-baseline.js \
            site/assets/js/dashboard.js \
            site/assets/js/graph-next.js \
            site/assets/js/graph-answer-enhancements.js \
            site/assets/js/paper-builder.js \
            site/assets/js/relax1000-core.js \
            site/assets/js/relax1000-reader.js \
            site/assets/js/relax1000-graph.js \
            site/assets/js/zhenti-data-overlay.js \
            site/assets/js/zhenti-graph.js \
            site/assets/js/zhenti-media.js \
            site/assets/js/zhenti-wall.js \
            site/assets/js/site-runtime-v2.js \
            site/assets/js/workspace-v3.js \
            site/assets/js/workspace-operations-v1.js \
            site/sw.js
          do
            node --check "$file"
          done
          grep -q 'data-resource-search' site/links/index.html
          grep -q 'data-ws-panel="operations"' site/workspace/index.html
          grep -Fq "const CACHE='everflow-site-v" site/sw.js
          git diff --check

  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate course catalogs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          paper_path=Path('site/data/oxygen.json')
          reinforcement_path=Path('site/data/oxygen-reinforcement.json')
          assert paper_path.is_file(), 'missing site/data/oxygen.json'
          assert reinforcement_path.is_file(), 'missing site/data/oxygen-reinforcement.json'

          paper=json.loads(paper_path.read_text(encoding='utf-8'))
          reinforcement=json.loads(reinforcement_path.read_text(encoding='utf-8'))

          items=(paper.get('course') or {}).get('items') or []
          assert len(items)>=2, f'past-paper course unexpectedly small: {len(items)}'
          years={int(item.get('year')) for item in items if item.get('year')}
          assert 2009 in years and 2010 in years, f'past-paper years incomplete: {sorted(years)}'

          subjects=reinforcement.get('subjects') or {}
          minimums={'ds':37,'co':29,'os':29,'cn':28}
          total=0
          for key,minimum in minimums.items():
              rows=(subjects.get(key) or {}).get('items') or []
              assert len(rows)>=minimum, f'reinforcement subject truncated: {key} {len(rows)}/{minimum}'
              total+=len(rows)
          assert total>=123, f'reinforcement catalog unexpectedly small: {total}/123'
          cn_titles={str(item.get('title') or '') for item in (subjects.get('cn') or {}).get('items') or []}
          assert '应用层选择题专题' in cn_titles, 'CN tail lesson missing: 应用层选择题专题'
          print(f'Course catalogs OK: past papers + reinforcement baseline {total} (DS>=37 CO>=29 OS>=29 CN>=28)')
          PY

      - name: Checkout question assets
        id: relax_checkout
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: EverflowCN/408-exercise-paper-generator
          ref: main
          path: .relax-source
          sparse-checkout: |
            站点/data
            站点/question-images
            站点/explanations
          sparse-checkout-cone-mode: false

      - name: Retry question assets checkout
        if: steps.relax_checkout.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .relax-source
          ok=0
          for attempt in 1 2 3; do
            echo "Relax asset checkout retry ${attempt}/3"
            if git clone --depth 1 --filter=blob:none --no-checkout https://github.com/EverflowCN/408-exercise-paper-generator.git .relax-source; then
              git -C .relax-source sparse-checkout init --no-cone
              printf '站点/data\n站点/question-images\n站点/explanations\n' > .relax-source/.git/info/sparse-checkout
              git -C .relax-source checkout main
              ok=1
              break
            fi
            rm -rf .relax-source
            sleep $((attempt * 5))
          done
          test "$ok" = 1
          test -d ".relax-source/站点/data"
          test -d ".relax-source/站点/question-images"
          test -d ".relax-source/站点/explanations"

      - name: Checkout 408 algorithm visualizer
        uses: actions/checkout@v6
        with:
          repository: EverflowCN/struct-viz
          ref: main
          path: .struct-viz

      - name: Setup Node.js for visualizer
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .struct-viz/package-lock.json

      - name: Validate and build visualizer
        working-directory: .struct-viz
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          git diff --check

      - name: Integrate visualizer and materialize deep links
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/visual
          mkdir -p site/visual
          cp -R .struct-viz/dist/. site/visual/

          for route in \
            sandbox \
            subject/data-structures \
            subject/computer-organization \
            subject/operating-systems \
            subject/computer-networks
          do
            mkdir -p "site/visual/${route}"
            cp site/visual/index.html "site/visual/${route}/index.html"
          done

      - name: Verify site
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/zhenti/index.html
          test -s site/zhenti/relax-reader/index.html
          test -s site/graph/index.html
          test -s site/graph-next/index.html
          test -s site/relax/index.html
          test -s site/408/index.html
          test -s site/data/oxygen.json
          test -s site/data/oxygen-reinforcement.json
          test -s site/data/zhenti/subject-index.json
          test -s site/visual/index.html
          test -s site/visual/sandbox/index.html
          test -s site/visual/subject/data-structures/index.html
          test -s site/visual/subject/computer-organization/index.html
          test -s site/visual/subject/operating-systems/index.html
          test -s site/visual/subject/computer-networks/index.html
          test -n "$(find site/visual/assets -type f -print -quit)"
          test -s site/assets/js/checkin.js
          test -s site/assets/js/course-catalog-baseline.js
          test -s site/assets/js/graph-app.js
          test -s site/assets/js/graph-controls.js
          test -s site/assets/js/graph-answer-enhancements.js
          test -s site/assets/js/zhenti-graph.js
          test -s site/assets/js/relax1000-graph.js
          test -s site/assets/js/relax1000-reader.js
          test -s site/assets/js/graph-next.js
          test -s site/assets/css/graph.css
          test -s site/assets/css/graph-answer-enhancements.css
          test -s site/assets/css/relax1000-reader-nav-v2.css
          test -s site/assets/css/graph-next.css
          test -s site/assets/js/site-runtime-v2.js
          test -s site/assets/js/links.js
          test -s site/assets/js/workspace-operations-v1.js
          test -s site/assets/css/resource-hub-v2.css
          test -s site/assets/css/auth-loading.css
          test ! -e site/assets/js/relax1000-cards-experience.js
          test ! -e site/assets/js/overall-graph.js
          test ! -e site/assets/css/overall-graph.css
          test ! -e site/assets/css/graph-controls.css
          echo "Everflow source tree ready"

      - name: Build privacy-safe static artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site/data/relax1000
          mkdir -p site/data/relax1000
          cp -R ".relax-source/站点/data" site/data/relax1000/data
          cp -R ".relax-source/站点/question-images" site/data/relax1000/question-images
          cp -R ".relax-source/站点/explanations" site/data/relax1000/explanations

          node site/tools/normalize-relax-corpus.mjs --site-root=site
          node site/tools/audit-question-banks.mjs --site-root=site

          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import unquote

          DROP_KEYS={
              'repository','repositoryurl','repo','repourl','github','githuburl',
              'source','sourcename','sourcelabel','sourcekey','sourcepath',
              'sourceurl','sourcehref','rawurl','sourcewebsite','sourceaddress',
              'sources','sourceids','sourceid','origin','originurl',
              'provider','providerurl','provenance','vendor','vendorurl'
          }
          SENSITIVE_MARKERS=(
              'everflowcn','408-exercise-paper-generator','tommytay0712',
              '408-exam-paper','csyanku','foreverlink','hermes 408'
          )

          def scrub_string(value):
              if not isinstance(value,str):
                  return value
              decoded=unquote(value)
              lower=decoded.lower()
              for marker in ('/question-images/','/explanations/'):
                  if marker in decoded:
                      return marker.lstrip('/')+decoded.split(marker,1)[1]
              if 'github.com' in lower or 'raw.githubusercontent.com' in lower:
                  return ''
              if any(marker in lower for marker in SENSITIVE_MARKERS):
                  return ''
              return value

          def scrub(value):
              if isinstance(value,dict):
                  return {key:scrub(item) for key,item in value.items() if key.lower() not in DROP_KEYS}
              if isinstance(value,list):
                  return [scrub(item) for item in value]
              return scrub_string(value)

          for json_path in Path('site/data').rglob('*.json'):
              try:
                  data=json.loads(json_path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              data=scrub(data)
              if json_path.as_posix().endswith('relax1000/data/questions.json') and isinstance(data,dict):
                  meta=data.get('meta')
                  if isinstance(meta,dict):
                      for key in ('repository','repo','source','sourceUrl','github','githubUrl','questionCount'):
                          meta.pop(key,None)
              if json_path.as_posix().endswith('zhenti/manifest.json') and isinstance(data,dict):
                  data.pop('policy',None)
                  data.pop('sources',None)
                  for meta in (data.get('years') or {}).values():
                      if isinstance(meta,dict):
                          meta.pop('notes',None)
                          meta.pop('sources',None)
              json_path.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          for name in ('audit-report.json','vendor-report.json'):
              p=Path('site/data/zhenti')/name
              if p.exists():
                  p.unlink()

          wall=Path('site/assets/js/zhenti-wall.js')
          if wall.exists():
              text=wall.read_text(encoding='utf-8')
              text=re.sub(r"const SOURCE_LABEL=\{.*?\};","const SOURCE_LABEL={};",text,count=1)
              text=re.sub(r"function sourceText\(item\)\{return .*?\}","function sourceText(){return'已核验'}",text,count=1)
              for marker in ('TommyTay0712','408-exam-paper','CSYanKu','ForeverLink','Hermes 408'):
                  text=text.replace(marker,'')
              wall.write_text(text,encoding='utf-8')
          PY

          node site/tools/build-admin-quality-report.mjs --site-root=site

          rm -rf site/tools

          if grep -RInEi --include='*.html' --include='*.js' --include='*.css' --include='*.json' 'EverflowCN|408-exercise-paper-generator|raw\.githubusercontent\.com/EverflowCN|TommyTay0712|408-exam-paper|CSYanKu|ForeverLink|Hermes 408' site; then
            echo 'Privacy audit failed: repository identity/address or bank-source details leaked into public artifact.'
            exit 1
          fi
          if grep -RInE --exclude-dir=data --include='*.html' --include='*.js' --include='*.css' '(^|[^0-9])1576([^0-9]|$)' site; then
            echo 'Privacy audit failed: exact Relax corpus count leaked into public UI/source.'
            exit 1
          fi

          test -s site/data/oxygen.json
          test -s site/data/oxygen-reinforcement.json
          test -s site/data/relax1000/data/questions.json
          test -s site/assets/js/graph-app.js
          test -s site/assets/js/graph-controls.js
          test -s site/assets/js/graph-answer-enhancements.js
          test -s site/assets/js/relax1000-reader.js
          test -s site/assets/js/zhenti-graph.js
          test -s site/assets/js/graph-next.js
          test -s site/assets/css/graph.css
          test -s site/assets/css/graph-answer-enhancements.css
          test -s site/assets/css/relax1000-reader-nav-v2.css
          test -s site/assets/css/graph-next.css
          echo '{"build":"20260828-reader5-graph-answer1"}' > site/build.json
          echo "Privacy-safe artifact ready"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
