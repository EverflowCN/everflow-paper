name: Append QWER fix log once

on:
  push:
    paths:
      - '.github/workflows/fix-log-once.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Append unified fix record
        shell: bash
        run: |
          set -euo pipefail
          marker='QWER 快捷键统一与 Relax 题号方块加深'
          if grep -q "$marker" docs/FIX_LOG.md; then
            echo 'FIX_LOG entry already exists'
            exit 0
          fi
          printf '%s' '' | base64 -d >> docs/FIX_LOG.md
          git config user.name 'Everflow Fix Log Bot'
          git config user.email '54564601+EverflowCN@users.noreply.github.com'
          git add docs/FIX_LOG.md
          git commit -m 'docs: record QWER and strong Relax wall rollout'
          git push origin HEAD:main
