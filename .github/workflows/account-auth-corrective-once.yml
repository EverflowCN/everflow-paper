name: Account auth corrective once

on:
  push:
    paths:
      - '.github/workflows/account-auth-corrective-once.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply corrective patches
        run: python .github/scripts/account_auth_corrective.py
      - name: Validate account auth and question sync
        shell: bash
        run: |
          set -euo pipefail
          node --check site/assets/js/account-auth-sync-v2.js
          node --check site/assets/js/question-cloud-sync-v2.js
          node site/tools/audit-bank-features.mjs
          git diff --check
      - name: Commit corrected site files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Everflow Maintenance'
          git config user.email '54564601+EverflowCN@users.noreply.github.com'
          git add site/tools/audit-bank-features.mjs site/sw.js docs/FIX_LOG.md
          git commit -m 'fix(account): verified signup and original interactions'
          git push origin HEAD:main
