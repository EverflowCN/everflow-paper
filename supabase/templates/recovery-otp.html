<div style="margin:0;background:#f5f6f8;padding:36px 16px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#111;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #e8e8ec;border-radius:24px;overflow:hidden;">
    <div style="height:6px;background:#ff1830;"></div>
    <div style="padding:32px 34px 0;font-size:22px;font-weight:800;">Everflow</div>
    <div style="padding:28px 34px 36px;">
      <div style="font-size:26px;font-weight:800;line-height:1.4;margin-bottom:12px;">重置你的密码</div>
      <div style="font-size:15px;line-height:1.8;color:#666;margin-bottom:28px;">你正在重置 Everflow 账户密码，请在网站中输入下面的 6 位验证码。</div>
      <div style="background:#f7f7f9;border:1px solid #ececf0;border-radius:18px;padding:26px 20px;text-align:center;margin-bottom:26px;">
        <div style="font-size:13px;color:#888;margin-bottom:10px;">密码重置验证码</div>
        <div style="font-size:38px;line-height:1.2;font-weight:800;letter-spacing:10px;color:#111;">{{ .Token }}</div>
      </div>
      <div style="background:#fff5f6;border:1px solid #ffe3e6;border-radius:14px;padding:15px 16px;font-size:13px;line-height:1.7;color:#666;">请勿将验证码透露给其他人。如果不是你本人发起的密码重置，可以直接忽略此邮件。</div>
    </div>
    <div style="border-top:1px solid #eeeeef;padding:22px 34px 26px;font-size:12px;line-height:1.7;color:#999;">此邮件由 Everflow 自动发送，请勿直接回复。</div>
  </div>
</div>
