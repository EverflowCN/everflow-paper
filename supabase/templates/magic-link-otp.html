<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#f6f6f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#111217">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="padding:32px 16px;background:#f6f6f7">
      <tr><td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:520px;background:#ffffff;border:1px solid #e8e8ec;border-radius:20px;padding:28px">
          <tr><td>
            <div style="font-size:12px;font-weight:800;letter-spacing:.12em;color:#f31224">EVERFLOW</div>
            <h1 style="font-size:24px;margin:8px 0 8px">登录验证码</h1>
            <p style="margin:0 0 20px;color:#737780;font-size:14px;line-height:1.7">请在 Everflow 登录页面输入下面的 6 位验证码。无需点击邮件中的登录链接。</p>
            <div style="font-size:34px;font-weight:900;letter-spacing:.22em;text-align:center;padding:18px;border-radius:14px;background:#f6f6f7">{{ .Token }}</div>
            <p style="margin:20px 0 0;color:#9a9da5;font-size:12px;line-height:1.7">如果不是你本人请求验证码，可以忽略此邮件。验证码过期后请回到 Everflow 重新获取。</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
